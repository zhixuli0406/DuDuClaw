# DuDuClaw Evaluator Agent Template (Phase 2 GVU²)
# Role: Independent QA verifier for agent outputs
# Usage: cp -r templates/evaluator/ ~/.duduclaw/agents/<your-evaluator>/

[agent]
name = "evaluator"
display_name = "QA Evaluator"
role = "specialist"
status = "active"
trigger = ""
reports_to = ""  # Set to orchestrator or calling agent
icon = "shield-check"

# Optional: choose the AI runtime backend (default: claude).
# Providers: "claude" | "codex" | "gemini" (deprecated in v1.67.0, removed in v1.69.0; use "antigravity") | "antigravity" | "openai_compat".
# "antigravity" drives Google's `agy` CLI (the 2026-06-18 successor to the
# personal Gemini CLI; install to ~/.local/bin/agy, Google sign-in via `agy` in a terminal, or `[antigravity] auth = "api_key"` + GEMINI_API_KEY).
# See docs/todo/TODO-antigravity-cli-migration.md.
# [runtime]
# provider = "antigravity"
# fallback = "claude"

[model]
preferred = "claude-haiku-4-5"  # Cost-efficient for verification
fallback = "claude-haiku-4-5"
account_pool = []  # empty = every rotator account; list account ids/labels to restrict this agent
api_mode = "cli"

[model.local]
model = ""
backend = "openai_compat"
context_length = 4096
gpu_layers = -1
prefer_local = true
use_router = true

[container]
timeout_ms = 60000
max_concurrent = 3
readonly_project = true
# Task sandbox: enable only after Docker runs and the sandbox image is on
# this machine (`duduclaw doctor` checks both). The AI inside must reach its
# model provider, so the sandbox also needs `network_access = true`.
sandbox_enabled = false
network_access = false

[heartbeat]
enabled = false
interval_seconds = 3600
max_concurrent_runs = 1
# `cron` is evaluated in `cron_timezone` when set, otherwise UTC.
# Empty cron falls back to interval_seconds.
cron = ""
# IANA timezone for `cron`. Empty = UTC (legacy behaviour pre-v1.8.23).
# Example: cron_timezone = "Asia/Taipei"  →  cron "0 9 * * *" fires at 09:00 Taipei.
cron_timezone = ""

[budget]
monthly_limit_cents = 500   # Lower budget — verification is lightweight
warn_threshold_percent = 80
hard_stop = false

[permissions]
can_create_agents = true
can_send_cross_agent = true   # Must reply to delegating agent
can_modify_own_skills = true
can_modify_own_soul = false
can_schedule_tasks = true
allowed_channels = []          # No direct channel access — bus only

[evolution]
skill_auto_activate = false
skill_security_scan = true
gvu_enabled = false            # Evaluator doesn't self-evolve
max_silence_hours = 168.0      # 7 days — evaluator is passive
skill_token_budget = 500
max_active_skills = 2

[evolution.external_factors]
user_feedback = false
security_events = true
channel_metrics = false
business_context = false
peer_signals = false

[capabilities]
computer_use = false
browser_via_bash = false
allowed_tools = []
denied_tools = []

# WP2.6 §4 — curated skills a QA/evaluator agent typically wants.
[skills]
recommended = [
    "anthropic-skills:webapp-testing",  # drive real app QA flows
]

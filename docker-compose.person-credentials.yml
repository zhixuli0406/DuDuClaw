# Opt-in overlay: start as root, give only the three capabilities required to
# drop privileges, add the root-only key volume, and run healthchecks as UID 1000.
# The base Compose file keeps cap_drop: ALL and no-new-privileges in effect.
# init: true, pid: host, or a set DOCKER_HOST (even empty) makes the launcher refuse to start.
# Never mount a container engine socket or a directory containing one into DuDuClaw:
# whoever controls the container then controls the host engine.
# The gateway refuses the key when DOCKER_HOST is set, a mount point is a Unix
# socket or engine-named, or a mount comes from a known engine directory.
# Detection is best-effort: sockets inside other mounted directories and abstract
# Unix sockets cannot be detected. Keep extra mounts to data directories.
# Usage: docker compose -f docker-compose.yml -f docker-compose.person-credentials.yml up -d
services:
  duduclaw:
    user: "0:0"
    cap_add: [SETUID, SETGID, SETPCAP]
    environment:
      - DUDUCLAW_PROTECTED_KEY_MODE=root-launcher
    volumes:
      - duduclaw-protected-key:/var/lib/duduclaw-protected
    healthcheck:
      test: ["CMD", "setpriv", "--reuid=1000", "--regid=1000", "--clear-groups", "curl", "-f", "http://localhost:18789/healthz"]

volumes:
  duduclaw-protected-key:

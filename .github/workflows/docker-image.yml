name: Docker image

# Build + push the official multi-arch DuDuClaw server image to GHCR.
#
# Runs ONLY on a release tag (`v*`) or a manual dispatch — adding this workflow
# does not publish anything on its own (releasing stays a human gate). The image
# is what the console `docker-compose` distribution pack pulls
# (`ghcr.io/zhixuli0406/duduclaw:<tag>` + `:latest`).
#
# Layout (2026-09-29 decision): one NATIVE build job per architecture, each
# pushing by digest, then a tiny merge job that assembles the multi-arch
# manifest with `docker buildx imagetools create`. The previous single job
# built arm64 under QEMU on an amd64 runner and took 5–5.5 hours — within
# minutes of GitHub's 6-hour job limit (v1.66.0: 5h41m, v1.66.1 first attempt:
# 5h15m). Native `ubuntu-24.04-arm` runners bring the arm64 leg down to the
# same tens of minutes as amd64.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.35.0)"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zhixuli0406/duduclaw

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only: the per-arch image gets no tag of its own, the
      # merge job below is the only thing that names it.
      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile.server
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          # ignore-error: the GHA cache backend's export step has failed AFTER
          # a fully successful build before (v1.42.0 + v1.43.0), killing the
          # run at the finish line. A cache-export failure must never fail the
          # publish — the cache is an optimization, the pushed image is the
          # product.
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }},ignore-error=true

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest and tag
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Resolve image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          ls -1
          docker buildx imagetools create \
            -t "${IMAGE}:${{ steps.meta.outputs.tag }}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.tag }}"

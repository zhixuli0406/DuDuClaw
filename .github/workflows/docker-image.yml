name: Docker image

# Build + push the official multi-arch DuDuClaw server image to GHCR.
#
# Runs ONLY on a release tag (`v*`) or a manual dispatch — adding this workflow
# does not publish anything on its own (releasing stays a human gate). The image
# is what the console `docker-compose` distribution pack pulls
# (`ghcr.io/zhixuli0406/duduclaw:<tag>` + `:latest`).
#
# Layout (2026-09-29 decision): one NATIVE build job per architecture, each
# pushing by digest, then a tiny merge job that assembles the multi-arch
# manifest with `docker buildx imagetools create`. The previous single job
# built arm64 under QEMU on an amd64 runner and took 5–5.5 hours — within
# minutes of GitHub's 6-hour job limit (v1.66.0: 5h41m, v1.66.1 first attempt:
# 5h15m). Native `ubuntu-24.04-arm` runners bring the arm64 leg down to the
# same tens of minutes as amd64.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.35.0)"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zhixuli0406/duduclaw

jobs:
  delivery-gate:
    uses: ./.github/workflows/release-delivery-gate.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read

  build:
    needs: delivery-gate
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Validate publish tag family
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.delivery-gate.outputs.commit }}

      - name: Select pinned workflow build recipe
        id: recipe
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.delivery-gate.outputs.commit }}
          RECIPE_COMMIT: ${{ github.sha }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$RECIPE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git --no-replace-objects rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || exit 1
          # Repair a build recipe through a reviewed workflow commit while
          # keeping the program source at the signed, immutable release tag.
          git --no-replace-objects fetch --no-tags --depth=1 origin "$RECIPE_COMMIT"
          recipe_file=$(mktemp "${RUNNER_TEMP}/duduclaw-server-recipe.XXXXXX")
          git --no-replace-objects show "$RECIPE_COMMIT:container/Dockerfile.server" > "$recipe_file"
          recipe_sha=$(sha256sum "$recipe_file" | cut -d ' ' -f 1)
          [[ "$(git --no-replace-objects rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || exit 1
          git diff --exit-code --quiet
          git diff --cached --exit-code --quiet
          printf 'Released program source: %s\nBuild recipe commit: %s\nBuild recipe SHA-256: %s\n' "$SOURCE_COMMIT" "$RECIPE_COMMIT" "$recipe_sha"
          printf 'file=%s\ncommit=%s\nsha256=%s\n' "$recipe_file" "$RECIPE_COMMIT" "$recipe_sha" >> "$GITHUB_OUTPUT"
          RECIPE_SHA256="$recipe_sha" python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              "scope": "released_source_and_build_recipe_inputs",
              "source_commit": os.environ["SOURCE_COMMIT"],
              "recipe_commit": os.environ["RECIPE_COMMIT"],
              "recipe_path": "container/Dockerfile.server",
              "recipe_sha256": os.environ["RECIPE_SHA256"],
              "platform": os.environ["BUILD_PLATFORM"],
          }
          path = Path(os.environ["RUNNER_TEMP"]) / ("docker-build-recipe-" + os.environ["BUILD_ARCH"] + ".json")
          with path.open("x") as file:
              file.write(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Upload build recipe receipt
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-recipe-${{ matrix.arch }}
          path: ${{ runner.temp }}/docker-build-recipe-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only: the per-arch image gets no tag of its own, the
      # merge job below is the only thing that names it.
      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.recipe.outputs.file }}
          labels: |
            org.opencontainers.image.revision=${{ needs.delivery-gate.outputs.commit }}
            org.duduclaw.build-recipe-revision=${{ steps.recipe.outputs.commit }}
            org.duduclaw.build-recipe-sha256=${{ steps.recipe.outputs.sha256 }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          # ignore-error: the GHA cache backend's export step has failed AFTER
          # a fully successful build before (v1.42.0 + v1.43.0), killing the
          # run at the finish line. A cache-export failure must never fail the
          # publish — the cache is an optimization, the pushed image is the
          # product.
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }},ignore-error=true

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest and tag
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Resolve image tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          ls -1
          docker buildx imagetools create \
            -t "${IMAGE}:${{ steps.meta.outputs.tag }}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.tag }}"

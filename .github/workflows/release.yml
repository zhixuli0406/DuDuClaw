name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.8.1)'
        required: true

permissions:
  contents: write

jobs:
  delivery-gate:
    uses: ./.github/workflows/release-delivery-gate.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read

  build:
    needs: delivery-gate
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    outputs:
      # SHA-256 of the aarch64 hand-off SHA256SUMS, set only by the aarch64 leg.
      # It travels through job outputs, not the artifact store it authenticates.
      arm64_inputs_sha256: ${{ steps.arm64_inputs.outputs.sha256 }}
    env:
      # MSVC symbols live in separate PDBs; retain the existing Windows output.
      CARGO_PROFILE_RELEASE_STRIP: ${{ startsWith(matrix.os, 'windows') && 'none' || 'symbols' }}
      # opt-level / codegen-units come from [profile.release] ("s" / 16) on every
      # platform; do not override via CARGO_PROFILE_RELEASE_* (<=1.79.2 updaters reject
      # a binary >= 200 MiB; Linux opt-level 3 measured ~226 MB).
    # Read only: no step of this job publishes a release asset or pushes anything.
    # Its outputs leave only as workflow artifacts (actions/upload-artifact uses the
    # runtime token, not GITHUB_TOKEN); the GitHub Release is created by `release`.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: duduclaw-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: duduclaw-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: duduclaw-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: duduclaw-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: duduclaw-windows-x64

    steps:
      - name: Validate publish tag family
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.delivery-gate.outputs.commit }}
          persist-credentials: false

      - name: Add swap (Linux)
        # Release-mode rustc for duduclaw-gateway exceeds the 16 GB runner (SIGKILL).
        # /mnt is the large ephemeral disk.
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/duduclaw-swap || sudo dd if=/dev/zero of=/mnt/duduclaw-swap bs=1M count=16384
          sudo chmod 600 /mnt/duduclaw-swap && sudo mkswap /mnt/duduclaw-swap && sudo swapon /mnt/duduclaw-swap
          free -h

      # No release build next to TEST-licence settings: test-root rustc flags, the
      # TEST issuer/key variables, rustc wrappers or Cargo configuration naming the
      # cfg (scripts/refuse-test-license-build.py; the Linux packager applies the
      # same rules again on every build/package run).
      - name: Refuse test-root build settings
        if: runner.os != 'Windows'
        run: python3 -I -B scripts/refuse-test-license-build.py --check-environment

      - name: Refuse test-root build settings (Windows)
        if: runner.os == 'Windows'
        run: |
          python -I -B scripts/refuse-test-license-build.py --check-environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          # Tags only restore caches written on main (protected), never PRs.
          shared-key: release-cross-glibc231-${{ matrix.target }}
          workspaces: . -> target
          save-if: false

      - name: Install cross (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2
        with:
          tool: cross

      - name: Build frontend
        run: cd web && npm ci --legacy-peer-deps && npm run build

      # The production bootstrap root pin comes only from the public file
      # release/bootstrap-root.sha256 (added after the key ceremony). While it is
      # absent no duduclaw-bootstrap is built or shipped (fail closed). Both
      # Linux targets are still cross-built here, so the glibc floor is unchanged;
      # the aarch64 verifier cannot run on this x86_64 runner, so its execution
      # is deferred to the native arm64 packaging job (package-linux-arm64).
      - name: Build binary (cross-compile — skip desktop feature, Wayland unavailable in cross)
        if: runner.os == 'Linux'
        run: python3 scripts/package-linux-release.py --target ${{ matrix.target }} --build-only --bootstrap-root-pin-file release/bootstrap-root.sha256 ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '--defer-bootstrap-probe' || '' }}
        env:
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Build binary (macOS/Windows — with desktop feature)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && runner.os != 'Linux'
        # vendored-openssl: webauthn-rs needs OpenSSL, and runners/customers have no
        # usable system copy. openssl-src needs perl + make (macOS) or perl + nmake +
        # NASM (Windows MSVC); all are preinstalled on GitHub-hosted runners, and the
        # Windows build already vendored OpenSSL via duduclaw-auth, so no extra env.
        run: cargo build --release --target ${{ matrix.target }} -p duduclaw-cli -p duduclaw-gateway --features duduclaw-gateway/dashboard,duduclaw-gateway/desktop,duduclaw-cli/dashboard,duduclaw-gateway/vendored-openssl

      # Before anything signs, notarises, packages or uploads it: the built gateway
      # must not be a TEST-licence build (static marker check, nothing executed).
      - name: Refuse a TEST-licence gateway (macOS)
        if: runner.os == 'macOS'
        run: python3 -I -B scripts/refuse-test-license-build.py target/${{ matrix.target }}/release/duduclaw

      - name: Refuse a TEST-licence gateway (Windows)
        if: runner.os == 'Windows'
        run: |
          python -I -B scripts/refuse-test-license-build.py target/${{ matrix.target }}/release/duduclaw.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check binary is portable (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/check_portable_binary.py target/${{ matrix.target }}/release/duduclaw

      - name: Check macOS signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::$key secret is required for macOS gateway releases"
              exit 1
            fi
          done

      - name: Import macOS gateway signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d  # v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # The verification tool (not the product source) follows the workflow
      # revision, so a broken verifier inside a signed tag can be fixed via
      # workflow_dispatch instead of moving the tag. The binary is still built
      # from the tag commit before this step runs.
      - name: Use workflow revision of the gateway verify script (macOS)
        if: runner.os == 'macOS' && github.sha != needs.delivery-gate.outputs.commit
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          TAG_COMMIT: ${{ needs.delivery-gate.outputs.commit }}
          # The checkout does not persist credentials: this one read-only fetch gets
          # the (contents: read) token through environment-scoped git config only,
          # never argv and never .git/config.
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::workflow SHA is not a 40-char lowercase hex commit"
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
          # The token is needed for the fetch only: nothing after it can see it.
          unset FETCH_TOKEN auth
          # No working-tree update at all: that could run a .gitattributes or local-config
          # smudge filter whose side effects no later comparison can undo. The blob is
          # written by cat-file (never filtered) to a new temporary file next to the
          # target, checked, made executable and renamed into place atomically. These git
          # calls still run without hooks, fsmonitor or system/global config.
          script=scripts/macos/verify-gateway-signature.sh
          staged="$(mktemp "${script%/*}/.verify-gateway-signature.XXXXXX")"
          if ! GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            git -c core.hooksPath=/dev/null -c core.fsmonitor= -c core.attributesFile=/dev/null \
            cat-file blob "FETCH_HEAD:$script" > "$staged"; then
            rm -f -- "$staged"
            echo "::error::$script is not a blob at $WORKFLOW_SHA"
            exit 1
          fi
          size="$(wc -c < "$staged" | tr -d '[:space:]')"
          if [[ ! "$size" =~ ^[0-9]+$ ]] || (( size == 0 || size > 1048576 )); then
            rm -f -- "$staged"
            echo "::error::$script at $WORKFLOW_SHA is empty or larger than 1 MiB"
            exit 1
          fi
          chmod 0755 "$staged"
          mv -f -- "$staged" "$script"
          echo "verify-gateway-signature.sh taken from workflow revision $WORKFLOW_SHA (build source commit: $TAG_COMMIT)"

      - name: Build, sign and notarize macOS gateway
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 scripts/macos/build-gateway-bundle.py --exe target/${{ matrix.target }}/release/duduclaw --name duduclaw --version "${TAG#v}" --out _gateway
          bash scripts/macos/sign-gateway.sh --app "_gateway/DuDuClaw Gateway.app" --exe target/${{ matrix.target }}/release/duduclaw --out ${{ matrix.artifact }}.app.zip
          bash scripts/macos/verify-gateway-signature.sh --app "_gateway/DuDuClaw Gateway.app" --exe target/${{ matrix.target }}/release/duduclaw --tag "$TAG"
          python3 scripts/verify_release_marker.py --tag "$TAG" --archive ${{ matrix.artifact }}.app.zip
          python3 scripts/check_update_archive_size.py ${{ matrix.artifact }}.app.zip
          shasum -a 256 ${{ matrix.artifact }}.app.zip > ${{ matrix.artifact }}.app.zip.sha256

      - name: Check binary is portable (Windows)
        if: runner.os == 'Windows'
        run: |
          python scripts/check_portable_binary.py target/${{ matrix.target }}/release/duduclaw.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Linux binaries and check glibc baseline
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        # Offline isolation target keys are never CI secrets. This explicitly
        # skips F metadata signing; the release operator signs it offline.
        # With a pin, the packager executes the verifier (native x86_64 here).
        run: python3 scripts/package-linux-release.py --target ${{ matrix.target }} --skip-build --output-dir . --bootstrap-root-pin-file release/bootstrap-root.sha256

      - name: Verify packaged duduclaw-bootstrap against the pin file
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        # Re-executes the verifier inside the finished archive (PRODUCTION <pin>
        # and this version), or proves it is absent when no pin is configured.
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-linux-release.py --target ${{ matrix.target }} --verify-archive duduclaw-linux-x64.tar.gz --bootstrap-root-pin-file release/bootstrap-root.sha256 > "$RUNNER_TEMP/bootstrap-summary.txt"
          { echo "### Linux bootstrap verifier"; cat "$RUNNER_TEMP/bootstrap-summary.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Export cross-built aarch64 binaries for native arm64 packaging
        id: arm64_inputs
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-linux-release.py --target ${{ matrix.target }} --skip-build --bootstrap-root-pin-file release/bootstrap-root.sha256 --export-binaries "$RUNNER_TEMP/linux-arm64-binaries"
          sums="$(sha256sum "$RUNNER_TEMP/linux-arm64-binaries/SHA256SUMS")"
          echo "sha256=${sums%% *}" >> "$GITHUB_OUTPUT"

      - name: Hand aarch64 binaries to the native arm64 packaging job
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: linux-arm64-binaries
          path: ${{ runner.temp }}/linux-arm64-binaries/
          if-no-files-found: error
          retention-days: 1

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p _pkg
          cp target/${{ matrix.target }}/release/duduclaw _pkg/
          cp -r python _pkg/python
          cd _pkg
          tar czf ../${{ matrix.artifact }}.tar.gz duduclaw python
          cd ..
          python3 scripts/check_update_archive_size.py ${{ matrix.artifact }}.tar.gz
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          rm -rf _pkg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path _pkg
          Copy-Item target/${{ matrix.target }}/release/duduclaw.exe _pkg/
          Copy-Item -Recurse python _pkg/python
          cd _pkg
          7z a ../${{ matrix.artifact }}.zip duduclaw.exe python
          cd ..
          python scripts/check_update_archive_size.py ${{ matrix.artifact }}.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Standard "hash  filename" layout so the in-app updater can parse it
          $hash = (Get-FileHash ${{ matrix.artifact }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii ${{ matrix.artifact }}.zip.sha256
          Remove-Item -Recurse -Force _pkg

      - name: Preserve unsigned archives and checksums
        # aarch64 is archived by package-linux-arm64 on a native arm64 runner.
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: unsigned-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            duduclaw-*.tar.gz
            duduclaw-*.zip
            duduclaw-*.sha256

  # The aarch64 binaries are cross-built on x86_64 above (unchanged glibc floor)
  # but packaged here: scripts/package-linux-release.py only ships
  # duduclaw-bootstrap after executing those exact bytes on a host of the target
  # architecture. The hand-off is authenticated by the SHA256SUMS digest from
  # the build job's outputs; every packaged byte is re-hashed against it.
  package-linux-arm64:
    needs: [build, delivery-gate]
    name: Package duduclaw-linux-arm64 (native arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Validate publish tag family
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.delivery-gate.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: linux-arm64-binaries
          path: ${{ runner.temp }}/linux-arm64-binaries

      - name: Package Linux arm64 binaries natively and check glibc baseline
        shell: bash
        env:
          INPUTS_SHA256: ${{ needs.build.outputs.arm64_inputs_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/package-linux-release.py --target aarch64-unknown-linux-gnu --skip-build --output-dir . --bootstrap-root-pin-file release/bootstrap-root.sha256 --binary-dir "$RUNNER_TEMP/linux-arm64-binaries" --binary-sums-sha256 "$INPUTS_SHA256"

      - name: Verify packaged duduclaw-bootstrap against the pin file
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-linux-release.py --target aarch64-unknown-linux-gnu --verify-archive duduclaw-linux-arm64.tar.gz --bootstrap-root-pin-file release/bootstrap-root.sha256 > "$RUNNER_TEMP/bootstrap-summary.txt"
          { echo "### Linux bootstrap verifier"; cat "$RUNNER_TEMP/bootstrap-summary.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve unsigned archives and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: unsigned-duduclaw-linux-arm64
          if-no-files-found: error
          path: |
            duduclaw-linux-arm64.tar.gz
            duduclaw-linux-arm64.tar.gz.sha256

  # Rekor/Fulcio failures must not discard hours of compilation. Unsigned build
  # artifacts remain available after failure; rerun only the failed signing job
  # with `gh run rerun RUN_ID --job SIGN_JOB_ID` (and its downstream dependents).
  # The macOS gateway bundle (.app.zip) is signed here too.
  sign:
    needs: [build, package-linux-arm64]
    name: Sign ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # cosign keyless (Sigstore OIDC); builds need no OIDC token
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: duduclaw-darwin-arm64
            extension: tar.gz
            app_bundle: true
          - artifact: duduclaw-darwin-x64
            extension: tar.gz
            app_bundle: true
          - artifact: duduclaw-linux-x64
            extension: tar.gz
          - artifact: duduclaw-linux-arm64
            extension: tar.gz
          - artifact: duduclaw-windows-x64
            extension: zip
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: unsigned-${{ matrix.artifact }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Sign and verify archive with retry
        shell: bash
        env:
          ARCHIVE: ${{ matrix.artifact }}.${{ matrix.extension }}
          APP_ZIP: ${{ matrix.artifact }}.app.zip
          APP_BUNDLE: ${{ matrix.app_bundle || 'false' }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # Six attempts, with five exponential delays: 30, 60, 120, 240, 480s.
          # Retry verification independently so a transient lookup does not re-sign.
          retry() {
            local attempt delay=30
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "::error::cosign failed after $attempt attempts"
                return 1
              fi
              echo "::warning::cosign attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          files=("$ARCHIVE")
          if [ "$APP_BUNDLE" = "true" ]; then
            files+=("$APP_ZIP")
          fi
          for f in "${files[@]}"; do
            if [ ! -f "$f" ] || [ ! -f "$f.sha256" ]; then
              echo "::error::missing $f or $f.sha256"
              exit 1
            fi
            sha256sum --check "$f.sha256"
            retry cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
            retry cosign verify-blob \
              --signature "$f.sig" \
              --certificate "$f.pem" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done

      - name: Upload verified signed archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ${{ matrix.artifact }}
          overwrite: true  # A signing-only rerun replaces this target's bundle.
          if-no-files-found: error
          path: |
            duduclaw-*.tar.gz
            duduclaw-*.zip
            duduclaw-*.sha256
            duduclaw-*.sig
            duduclaw-*.pem

  release:
    needs: [sign, delivery-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.delivery-gate.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: duduclaw-*
          merge-multiple: true

      # Every archive about to be minisigned and published: no duduclaw* member may
      # be a TEST-licence build (scripts/refuse-test-license-build.py).
      - name: Refuse TEST-licence gateways in the release archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(duduclaw-*.tar.gz duduclaw-*.zip)
          if (( ${#archives[@]} == 0 )); then
            echo "::error::no release archives to check"
            exit 1
          fi
          python3 -I -B scripts/refuse-test-license-build.py "${archives[@]}"

      # The in-app updater (crates/duduclaw-gateway/src/updater.rs) REQUIRES a
      # valid .minisig for every archive — an unsigned release cannot be
      # installed via self-update, so fail the release instead of shipping one.
      - name: Sign release assets with minisign (Ed25519)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY secret is not set — release assets must be signed for self-update to work"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          trap 'rm -f /tmp/minisign.key' EXIT
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          for f in duduclaw-*.tar.gz duduclaw-*.zip; do
            [ -f "$f" ] || continue
            python3 scripts/verify_release_marker.py --tag "$TAG" --archive "$f"
            minisign -S -s /tmp/minisign.key -m "$f" -t "duduclaw $TAG $f" -x "$f.minisig"
          done
          rm -f /tmp/minisign.key
          ls -l duduclaw-*.minisig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            duduclaw-*.tar.gz
            duduclaw-*.zip
            duduclaw-*.sha256
            duduclaw-*.minisig
            duduclaw-*.sig
            duduclaw-*.pem

  # Offline bundles of the default knowledge-base embedding model (model
  # files + the pinned ONNX Runtime archive) for machines without internet.
  # Signed with the release minisign key (the key the self-updater trusts);
  # the binary checks that signature before it unpacks a bundle, then every
  # file against the pins compiled into it.
  kb-model-bundles:
    needs: [release, delivery-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.delivery-gate.outputs.commit }}

      - name: Build and upload offline embedding-model bundles
        env:
          GH_TOKEN: ${{ github.token }}
          KB_BUNDLE_CACHE: ${{ runner.temp }}/kb-cache
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          # Through env, never interpolated into the script text.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY secret is not set — offline bundles must be signed"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$RUNNER_TEMP/minisign.key"' EXIT
          export KB_BUNDLE_MINISIGN_KEY="$RUNNER_TEMP/minisign.key" KB_BUNDLE_TAG="$TAG"
          mkdir -p "$KB_BUNDLE_CACHE" dist-kb
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            ./scripts/kb-model-bundle.sh "$target" multilingual-e5-small dist-kb
          done
          rm -f "$RUNNER_TEMP/minisign.key"
          gh release upload "$TAG" dist-kb/duduclaw-kb-model-*.tar dist-kb/duduclaw-kb-model-*.tar.sha256 dist-kb/duduclaw-kb-model-*.tar.minisig --clobber

  # Publish to npm
  npm-publish:
    needs: [release, delivery-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.delivery-gate.outputs.commit }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: duduclaw-*
          merge-multiple: true
          path: artifacts

      - name: Prepare and publish npm packages
        if: env.HAS_TOKEN == 'true'
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ARTIFACTS_DIR: ./artifacts
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          ./npm/scripts/publish.sh "$VERSION"

  # Publish Python SDK to PyPI
  pypi-publish:
    needs: [release, delivery-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for PyPI Trusted Publisher (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.delivery-gate.outputs.commit }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Build Python package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI (Trusted Publisher)
        if: env.HAS_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1
        # Uses OIDC Trusted Publisher — no API token needed.
        # Set up at: https://pypi.org/manage/project/duduclaw/settings/publishing/
        # Add GitHub publisher: zhixuli0406/DuDuClaw, workflow: release.yml, environment: (blank)
        with:
          skip-existing: true

      - name: Publish to PyPI (token fallback)
        if: env.HAS_PYPI != 'true' && env.HAS_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
        env:
          HAS_TOKEN: ${{ secrets.PYPI_TOKEN != '' }}

    env:
      HAS_PYPI: ${{ vars.PYPI_TRUSTED_PUBLISHER == 'true' }}


name: Docker Codex sandbox

on:
  pull_request:
    paths:
      - container/seccomp-bwrap.json
      - container/Dockerfile.server
      - crates/duduclaw-gateway/src/runtime/codex.rs
      - crates/duduclaw-gateway/src/runtime/codex_sandbox.rs
      - crates/duduclaw-core/src/ns_guard.rs
      - container/apparmor/**
      - docker-compose*.yml
      - container/docker-compose.quickstart.yml
      - scripts/docker-apparmor-setup.sh
      - scripts/gen-seccomp-bwrap.py
      - scripts/live-test/docker-codex-sandbox.sh
      - .github/workflows/docker-sandbox.yml
  push:
    branches: [main]
    paths:
      - container/seccomp-bwrap.json
      - container/Dockerfile.server
      - crates/duduclaw-gateway/src/runtime/codex.rs
      - crates/duduclaw-gateway/src/runtime/codex_sandbox.rs
      - crates/duduclaw-core/src/ns_guard.rs
      - container/apparmor/**
      - docker-compose*.yml
      - container/docker-compose.quickstart.yml
      - scripts/docker-apparmor-setup.sh
      - scripts/gen-seccomp-bwrap.py
      - scripts/live-test/docker-codex-sandbox.sh
      - .github/workflows/docker-sandbox.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SANDBOX_IMAGE: ghcr.io/zhixuli0406/duduclaw:v1.77.1

jobs:
  sandbox:
    name: Sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Check generated seccomp profile
        run: |
          python3 scripts/gen-seccomp-bwrap.py > "$RUNNER_TEMP/seccomp-bwrap.json"
          diff -u container/seccomp-bwrap.json "$RUNNER_TEMP/seccomp-bwrap.json"
      - name: Set up restricted user namespaces on Ubuntu 24.04
        if: matrix.os == 'ubuntu-24.04'
        run: |
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          sudo scripts/docker-apparmor-setup.sh
          echo 'DUDUCLAW_APPARMOR_PROFILE=duduclaw-userns' >> "$GITHUB_ENV"
      - name: Assert setup does nothing on Ubuntu 22.04
        if: matrix.os == 'ubuntu-22.04'
        run: |
          test ! -e /etc/apparmor.d/duduclaw-userns
          if test -e /sys/kernel/security/apparmor/profiles; then
            sudo cat /sys/kernel/security/apparmor/profiles > "$RUNNER_TEMP/apparmor-before"
          fi
          scripts/docker-apparmor-setup.sh | tee "$RUNNER_TEMP/apparmor-setup"
          grep -q '^Nothing needed:' "$RUNNER_TEMP/apparmor-setup"
          test ! -e /etc/apparmor.d/duduclaw-userns
          if test -e "$RUNNER_TEMP/apparmor-before"; then
            sudo cat /sys/kernel/security/apparmor/profiles > "$RUNNER_TEMP/apparmor-after"
            diff -u "$RUNNER_TEMP/apparmor-before" "$RUNNER_TEMP/apparmor-after"
          fi
      - name: Pull acceptance image
        run: docker pull "$SANDBOX_IMAGE"
      - name: Verify real employee sandbox
        run: scripts/live-test/docker-codex-sandbox.sh "$SANDBOX_IMAGE"

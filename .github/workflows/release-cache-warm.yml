# Compile release dependencies on the default branch so fresh tags can restore
# them. Only protected main writes these shared caches; PR caches are invisible
# to tag builds. Keep setup, runner, workspaces and cache inputs in sync with
# release.yml and desktop-release.yml (rustc, compiler env, manifests/locks and
# .cargo/config.toml/rust-toolchain files also contribute to rust-cache's key).
name: Warm release Rust caches

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - rust-toolchain*
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cache-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decide:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check whether release dependencies changed
        id: decide
        env:
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_warm_needed.py

  release:
    needs: decide
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.decide.outputs.run != 'false' }}
    runs-on: ${{ matrix.os }}
    env:
      # MSVC symbols live in separate PDBs; retain the existing Windows output.
      CARGO_PROFILE_RELEASE_STRIP: ${{ startsWith(matrix.os, 'windows') && 'none' || 'symbols' }}
      # Keep in sync with release.yml (CARGO_* env is part of the rust-cache key).
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ startsWith(matrix.os, 'windows') && 's' || '3' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: release-cross-glibc231-${{ matrix.target }}
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cross (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2
        with:
          tool: cross

      - name: Build frontend
        run: cd web && npm ci --legacy-peer-deps && npm run build

      - name: Build binary (cross-compile — skip desktop feature, Wayland unavailable in cross)
        if: runner.os == 'Linux'
        run: python3 scripts/package-linux-release.py --target ${{ matrix.target }} --build-only
        env:
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Build binary (macOS/Windows — with desktop feature)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }} -p duduclaw-cli -p duduclaw-gateway --features duduclaw-gateway/dashboard,duduclaw-gateway/desktop,duduclaw-cli/dashboard,duduclaw-gateway/vendored-openssl

      - name: Check Linux glibc baseline
        if: runner.os == 'Linux'
        run: python3 scripts/check_glibc.py target/${{ matrix.target }}/release/duduclaw

  desktop-release:
    needs: decide
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.decide.outputs.run != 'false' }}
    runs-on: ${{ matrix.os }}
    env:
      # MSVC symbols live in separate PDBs; retain the existing Windows output.
      CARGO_PROFILE_RELEASE_STRIP: ${{ startsWith(matrix.os, 'windows') && 'none' || 'symbols' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          shared-key: desktop-release-${{ matrix.target }}
          workspaces: |
            . -> target
            src-tauri -> target
          # Preserve scarce macOS cache space; Linux/Windows restore without saving.
          save-if: ${{ github.ref == 'refs/heads/main' && runner.os == 'macOS' }}

      - name: Linux deps (WebKitGTK)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 20

      - name: Build web dashboard
        run: cd web && npm ci && npm run build

      - name: Generate app icons
        shell: bash
        run: |
          cargo install tauri-cli --version "=2.12.4" --locked
          cd src-tauri && cargo tauri icon icons/source/duduclaw-1024.png

      # Keep the shipped CLI sidecar on the same baseline as the CLI release.
      - name: Install cross for Linux sidecar
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b
        with:
          tool: cross

      - name: Build & stage gateway sidecar
        shell: bash
        run: |
          SIDECAR_TARGET_DIR=target
          if [[ "${{ runner.os }}" == Linux ]]; then
            # Never reuse native desktop host build scripts inside the older cross image.
            SIDECAR_TARGET_DIR=target/linux-sidecar
            CARGO_TARGET_DIR="$SIDECAR_TARGET_DIR" PKG_CONFIG_ALLOW_CROSS=1 cross build --release -p duduclaw-cli --bin duduclaw --target ${{ matrix.target }} --no-default-features --features duduclaw-gateway/dashboard,duduclaw-cli/dashboard,duduclaw-gateway/vendored-openssl
            python3 scripts/check_glibc.py "$SIDECAR_TARGET_DIR/${{ matrix.target }}/release/duduclaw"
          else
            # Ship a self-contained sidecar: vendor OpenSSL (webauthn-rs) instead of
            # linking the runner's system/Homebrew copy.
            # Git Bash's MSYS perl lacks modules OpenSSL's Configure needs; use the
            # runner's Strawberry Perl on Windows.
            if [[ "${{ matrix.target }}" == *windows* ]]; then
              export OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe
            fi
            cargo build --release -p duduclaw-cli --bin duduclaw --target ${{ matrix.target }} --features duduclaw-gateway/vendored-openssl
          fi
          mkdir -p src-tauri/binaries
          EXT=""; [[ "${{ matrix.target }}" == *windows* ]] && EXT=".exe"
          cp "$SIDECAR_TARGET_DIR/${{ matrix.target }}/release/duduclaw${EXT}" \
             "src-tauri/binaries/duduclaw-${{ matrix.target }}${EXT}"

      # Tauri uses the same release profile and custom-protocol feature as its
      # publishing action; --no-bundle stops before packaging and signing.
      - name: Build desktop Rust (no bundles)
        working-directory: src-tauri
        run: cargo tauri build --no-bundle --target ${{ matrix.target }}

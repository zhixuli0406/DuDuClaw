name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

# Cancel superseded PR revisions; main runs must finish for release preflight.
# Separate event groups keep manual runs independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep debug assertions and the complete test suite, but omit debug symbols
  # from CI builds to reduce compilation, linking, binary size and cache cost.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  settle:
    name: Await latest revision
    runs-on: ubuntu-latest
    outputs:
      rust_mode: ${{ steps.classify.outputs.rust_mode }}
      dashboard: ${{ steps.classify.outputs.dashboard }}
      discord_voice: ${{ steps.classify.outputs.discord_voice }}
      app_compat: ${{ steps.classify.outputs.app_compat }}
    steps:
      - name: Allow consecutive PR pushes to settle
        if: github.event_name == 'pull_request'
        run: sleep 60
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changes using the trusted base
        id: classify
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf 'rust_mode=full\ndashboard=run\ndiscord_voice=true\napp_compat=true\n' >> "$GITHUB_OUTPUT"
          elif git show "$BASE_SHA:scripts/ci_classify.py" > "$RUNNER_TEMP/ci_classify.py"; then
            # Publish outputs only after success; missing/failed classifiers run full CI.
            output="$RUNNER_TEMP/ci-classify-output"
            : > "$output"
            GITHUB_OUTPUT="$output" python3 -I "$RUNNER_TEMP/ci_classify.py"
            cat "$output" >> "$GITHUB_OUTPUT"
          fi

  rust:
    needs: settle
    # A failed settle job must still run every required check; only workflow
    # cancellation should prevent these jobs from starting.
    if: ${{ !cancelled() }}
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs keep the required Linux check; native platform coverage runs
        # after merge, nightly and on demand for the release preflight.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    env:
      NEXTEST_PROFILE: ${{ (github.event_name == 'pull_request' || matrix.os == 'ubuntu-latest') && 'ci' || 'ci-native' }}
    steps:
      - name: Skip Rust for documentation and web-only changes
        if: ${{ needs.settle.outputs.rust_mode == 'skip' }}
        run: echo "Only allowlisted documentation or web paths changed; Rust is skipped."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: ${{ needs.settle.outputs.rust_mode != 'skip' }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ needs.settle.outputs.rust_mode != 'skip' }}
        # NOTE: dtolnay/rust-toolchain is maintained by a trusted Rust community
        # member and does not follow SHA-pinning conventions upstream. Pinning
        # by tag is accepted here as a documented trust decision.
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        if: ${{ needs.settle.outputs.rust_mode != 'skip' }}
        with:
          shared-key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux system deps (xcap screen-capture → wayland/xcb/gbm)
        # duduclaw-gateway pulls `xcap` (screenshot for computer-use), which on
        # Linux builds `wayland-sys`/`gbm` via pkg-config and needs these -dev
        # headers. Ubuntu-only; macOS/Windows use their native capture backends.
        if: ${{ needs.settle.outputs.rust_mode != 'skip' && (runner.os == 'Linux') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxcb1-dev libxcb-randr0-dev \
            libxrandr-dev libdbus-1-dev libgbm-dev libpipewire-0.3-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libxdo-dev libopus-dev
      - name: Stub dashboard assets for compile
        if: ${{ needs.settle.outputs.rust_mode != 'skip' }}
        # `duduclaw-cli` has `default = ["dashboard"]`, so the workspace build
        # compiles `duduclaw-dashboard` (via cli) even though it's `--exclude`d
        # as a top-level target. Its `#[derive(RustEmbed)] #[folder="dist/"]`
        # needs the folder to exist to generate `Asset::get`; the real assets
        # are built by the Dashboard job's `npm run build`. A stub lets the
        # core build compile without the frontend toolchain.
        shell: bash
        run: |
          mkdir -p crates/duduclaw-dashboard/dist
          printf '<!doctype html><title>ci-stub</title>' > crates/duduclaw-dashboard/dist/index.html
      - name: Check release version bump
        if: ${{ needs.settle.outputs.rust_mode == 'check' }}
        run: cargo check --locked --workspace --exclude duduclaw-bridge --exclude duduclaw-dashboard
      - name: Install nextest
        if: ${{ needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' }}
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: nextest@0.9.150
      - name: Build core crates (no dashboard)
        if: ${{ needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' }}
        run: cargo build --locked --workspace --exclude duduclaw-bridge --exclude duduclaw-dashboard --exclude duduclaw-gateway
      - name: Build gateway (no dashboard)
        if: ${{ needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' }}
        run: cargo build --locked -p duduclaw-gateway --no-default-features
      # H7: `otel.rs` (883 LOC) sits behind a default-off cargo feature that no
      # build in this repo had ever turned on, so its `gen_ai.*` span code could
      # rot unnoticed. One cheap `cargo check` keeps it compiling. Deliberately
      # `check`, not `test`: with no collector attached there is nothing to
      # assert at runtime, and the failure mode being guarded is "it no longer
      # compiles". `--no-default-features` matches the gateway build directly
      # above so the two share a warm cache.
      #
      # Runs on every OS leg. Until 2026-09-29 the five optional otel
      # dependencies sat under `[target.'cfg(target_os = "linux")'.dependencies]`, so
      # `--features otel` could not compile on macOS or Windows at all (H7 in
      # the feature audit moved them into the plain `[dependencies]` table;
      # verified locally on aarch64-apple-darwin the same day).
      - name: Test gateway Discord voice TLS transport
        # Songbird is an existing Linux-only dependency. Exercise its Serenity
        # bridge so the security transport backport cannot silently rot.
        if: ${{ needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' && needs.settle.outputs.discord_voice != 'false' && (runner.os == 'Linux') }}
        run: cargo test --locked -p duduclaw-gateway --no-default-features --features discord-voice --lib discord_voice
      - name: Check gateway with OpenTelemetry feature
        if: ${{ needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' }}
        run: cargo check --locked -p duduclaw-gateway --no-default-features --features otel
      # S16 (2026-09-29): the `duduclaw compat` family is OS-only — DuDuClaw
      # OS's shell spawns `duduclaw compat windows-vm app`, no platform install
      # does — so it moved behind the default-off `app-compat` feature and NO
      # platform build compiles it. Unlike the otel check above this one
      # TESTS, not just checks: the feature gates 48 unit tests (11 in
      # duduclaw-core `compat_runners`, 37 in duduclaw-cli `compat_*`) that
      # would otherwise never run anywhere but an OS bake.
      - name: Test cli with app-compat feature (OS-only surface)
        if: ${{ needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' && needs.settle.outputs.app_compat != 'false' }}
        run: |
          cargo test --locked -p duduclaw-core --lib --features app-compat -- compat_runners
          cargo test --locked -p duduclaw-cli --lib --features app-compat -- compat
      - name: Test (no dashboard)
        id: nextest_workspace
        if: ${{ needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' }}
        run: cargo nextest run --locked --no-fail-fast --workspace --exclude duduclaw-bridge --exclude duduclaw-dashboard --exclude duduclaw-gateway
      - name: Summarize nextest workspace
        if: ${{ always() && needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' }}
        shell: bash
        run: python3 scripts/ci_nextest_summary.py "target/nextest/$NEXTEST_PROFILE/junit.xml" "target/nextest/reports/workspace.xml"
      - name: Test workspace doctests
        # Preserve cargo test --no-fail-fast: doctests still run after suite failures.
        if: ${{ !cancelled() && needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' && (steps.nextest_workspace.outcome == 'success' || steps.nextest_workspace.outcome == 'failure') }}
        run: cargo test --locked --doc --no-fail-fast --workspace --exclude duduclaw-bridge --exclude duduclaw-dashboard --exclude duduclaw-gateway
      - name: Run every required Windows case on the native host
        if: ${{ needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' && (runner.os == 'Windows') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $tests = @(
            'publication::windows::tests::protected_owner_mutex_and_private_recovery_directory_are_validated',
            'publication::windows::tests::namespace_squatter_with_broad_acl_is_rejected',
            'test_runner::tests::windows::passing_command_exit_zero',
            'test_runner::tests::windows::failing_command_nonzero',
            'test_runner::tests::windows::runs_in_workspace_cwd',
            'test_runner::tests::windows::timeout_kills_and_marks',
            'test_runner::tests::windows::timeout_kills_child_and_grandchild'
          )
          foreach ($test in $tests) {
            $filename = $test.Replace('::', '-') + '.log'
            $output = & cargo test --locked -p duduclaw-fork --lib $test -- --exact --nocapture --test-threads=1 2>&1 |
              Tee-Object -FilePath (Join-Path evidence $filename)
            $exitCode = $LASTEXITCODE
            $output | Write-Output
            if ($exitCode -ne 0) { throw "Required Windows test failed: $test (exit $exitCode)" }
            if (-not ($output | Where-Object { "$_" -match '^test result: ok\. 1 passed; 0 failed; 0 ignored;' })) {
              throw "Required Windows test did not execute exactly once: $test"
            }
          }
      # The reviewable-workflow end-to-end tests drive a real stdio CLI and
      # pause it at test checkpoints; they run in their own step below.
      - name: Test gateway
        id: nextest_gateway
        if: ${{ needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' }}
        run: cargo nextest run --locked --no-fail-fast -p duduclaw-gateway --no-default-features -E 'not (test(three_page_pilot_) or test(security_race_tests) or test(resume_tests) or test(f1b_e2e_tests) or test(f5a_e2e_tests))'
      - name: Summarize nextest gateway
        if: ${{ always() && needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' }}
        shell: bash
        run: python3 scripts/ci_nextest_summary.py "target/nextest/$NEXTEST_PROFILE/junit.xml" "target/nextest/reports/gateway.xml"
      - name: Test gateway doctests
        # Preserve cargo test --no-fail-fast: doctests still run after suite failures.
        if: ${{ !cancelled() && needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' && (steps.nextest_gateway.outcome == 'success' || steps.nextest_gateway.outcome == 'failure') }}
        run: cargo test --locked --doc --no-fail-fast -p duduclaw-gateway --no-default-features -- --skip three_page_pilot_ --skip security_race_tests --skip resume_tests --skip f1b_e2e_tests --skip f5a_e2e_tests
      - name: Test workflow stdio checkpoints (CLI, workflow-test-checkpoints)
        if: ${{ needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' && (matrix.os == 'ubuntu-latest') }}
        run: cargo test --locked --no-fail-fast -p duduclaw-cli --test workflow_stdio --features workflow-test-checkpoints
      - name: Test workflow end to end (pilot, races, resume, F1b, F5-A) against the built CLI
        if: ${{ needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' && (matrix.os == 'ubuntu-latest') }}
        env:
          DUDUCLAW_P1_PILOT_EVIDENCE_DIR: ${{ runner.temp }}/pilot-evidence
        run: |
          cargo build --locked -p duduclaw-cli
          mkdir -p "$DUDUCLAW_P1_PILOT_EVIDENCE_DIR"
          export DUDUCLAW_P1_PILOT_BINARY="$GITHUB_WORKSPACE/target/debug/duduclaw"
          cargo test --locked --no-fail-fast -p duduclaw-gateway --no-default-features --lib three_page_pilot_ -- --test-threads=1
          cargo test --locked --no-fail-fast -p duduclaw-gateway --no-default-features --lib workflow::security_race_tests -- --test-threads=1
          cargo test --locked --no-fail-fast -p duduclaw-gateway --no-default-features --lib workflow::resume_tests -- --test-threads=1
          cargo test --locked --no-fail-fast -p duduclaw-gateway --no-default-features --lib workflow::f1b_e2e_tests -- --test-threads=1
          cargo test --locked --no-fail-fast -p duduclaw-gateway --no-default-features --lib workflow::f5a_e2e_tests -- --test-threads=1
      - name: Upload nextest JUnit reports
        if: ${{ always() && needs.settle.outputs.rust_mode != 'skip' && needs.settle.outputs.rust_mode != 'check' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nextest-${{ matrix.os }}
          path: target/nextest/reports/*.xml
          retention-days: 7
          if-no-files-found: warn

  dashboard:
    needs: settle
    # A failed settle job must still run every required check; only workflow
    # cancellation should prevent these jobs from starting.
    if: ${{ !cancelled() && needs.settle.outputs.dashboard != 'skip' }}
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        # NOTE: dtolnay/rust-toolchain is maintained by a trusted Rust community
        # member and does not follow SHA-pinning conventions upstream. Pinning
        # by tag is accepted here as a documented trust decision.
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          # The Linux Rust job is the sole writer of this shared cache.
          shared-key: ci-ubuntu-latest
          save-if: false
      - name: Install Linux system deps (xcap screen-capture → wayland/xcb/gbm)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxcb1-dev libxcb-randr0-dev \
            libxrandr-dev libdbus-1-dev libgbm-dev libpipewire-0.3-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libxdo-dev
      - name: Install frontend dependencies
        run: cd web && npm ci --legacy-peer-deps
      - name: TypeScript check
        run: cd web && npx tsc --noEmit
      - name: Unit tests
        run: cd web && npm test
      - name: Build frontend
        run: cd web && npm run build
      - name: Build dashboard crate
        run: cargo build --locked -p duduclaw-dashboard -p duduclaw-gateway --features duduclaw-gateway/dashboard -p duduclaw-cli --features duduclaw-cli/dashboard

  python:
    needs: settle
    # A failed settle job must still run every required check; only workflow
    # cancellation should prevent these jobs from starting.
    if: ${{ !cancelled() }}
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        # pytest/ruff toolchain + the package's runtime deps (pyyaml/httpx/anthropic)
        # that the test modules import.
        run: pip install pytest==8.3.4 pytest-asyncio==0.24.0 ruff==0.8.6 pyyaml>=6.0 httpx>=0.27 anthropic>=0.40
      - name: Lint
        run: ruff check python/
      - name: Test
        run: |
          if [ -n "$(find tests/python -name 'test_*.py' 2>/dev/null)" ]; then
            pytest tests/python/ -v
          else
            echo "No Python tests found, skipping"
          fi
      - name: Google Chat bootstrap checks
        run: |
          bash -n scripts/googlechat/bootstrap.sh
          python3 -m unittest discover -s scripts/googlechat -p 'test_*.py' -v
          if command -v shellcheck >/dev/null 2>&1; then shellcheck scripts/googlechat/bootstrap.sh; fi
      - name: Test CI coverage contract
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_ci*.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_check_glibc.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_check_embedded_paths.py' -v
          python3 scripts/check_embedded_paths.py . container/Dockerfile.server
          python3 scripts/check_embedded_paths.py . container/Dockerfile.edition-smoke --stage builder
          python3 -m unittest scripts.tests.test_server_entrypoint -v
      - name: Test distributor release tooling
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*distributor*.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_release_delivery.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_release_pro_gate.py' -v
          bash -n scripts/release.sh

  security:
    needs: settle
    # A failed settle job must still run every required check; only workflow
    # cancellation should prevent these jobs from starting.
    if: ${{ !cancelled() }}
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Run cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2025-0119 \
            --ignore RUSTSEC-2026-0150 \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2026-0176 \
            --ignore RUSTSEC-2026-0177 \
            --ignore RUSTSEC-2026-0293
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 22
      - name: Audit JavaScript dependency locks
        run: |
          for directory in web clients/vscode clients/streamdeck clients/obsidian/duduclaw adapters/paperclip-adapter; do
            npm --prefix "$directory" audit --package-lock-only --audit-level=low
          done
      - name: Verify security backport provenance
        run: python3 scripts/verify_security_vendor.py
      - name: Audit desktop dependency lock
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Install GLib development files
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev
      - name: Exercise optimized GLib string iterators
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml -p glib --lib variant_iter::tests::test_variant_str_iter

# Desktop app release pipeline (TODO §D4.5).
# Builds the Tauri shell on macOS / Windows / Linux, signs + notarizes, and
# publishes installers + the updater manifest (latest.json) to a GitHub release.
#
# Required repo secrets (Settings → Secrets → Actions):
#   TAURI_SIGNING_PRIVATE_KEY            updater private key (tauri signer)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password
#   APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD   (Developer ID .p12, base64)
#   WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Desktop release tag (desktop-vX.Y.Z)
        required: true
        type: string
      rebuild_v1750_desktop:
        description: Rebuild desktop-v1.75.0 with the merged PR #153 Tauri path fix
        required: false
        default: false
        type: boolean

jobs:
  delivery-gate:
    uses: ./.github/workflows/release-delivery-gate.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read

  build-source:
    needs: delivery-gate
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.select.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify desktop build source
        id: select
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SIGNED_SOURCE: ${{ needs.delivery-gate.outputs.commit }}
          REBUILD_V1750: ${{ inputs.rebuild_v1750_desktop && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$REBUILD_V1750" != true ]]; then
            echo "commit=$SIGNED_SOURCE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The v1.75.0 delivery assertion remains bound to its original tag.
          # The only permitted desktop packaging change is merged PR #153.
          [[ "$RELEASE_TAG" == desktop-v1.75.0 ]]
          [[ "$SIGNED_SOURCE" == b80df7f423f7bc2179f1ffb60f66d757aec5d323 ]]
          BUILD_SOURCE=a182caf0ba42ac62b76af462f7fe0389599e97fd
          git fetch --no-tags origin main:refs/remotes/origin/main
          git cat-file -e "$BUILD_SOURCE^{commit}"
          git merge-base --is-ancestor "$SIGNED_SOURCE" "$BUILD_SOURCE"
          git merge-base --is-ancestor "$BUILD_SOURCE" origin/main
          python3 - "$SIGNED_SOURCE" "$BUILD_SOURCE" <<'PY'
          import subprocess
          import sys

          signed, build = sys.argv[1:]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", signed, build], text=True
          ).splitlines()
          if changed != ["src-tauri/tauri.conf.json"]:
              raise SystemExit(f"unexpected desktop source changes: {changed}")

          def show(revision):
              return subprocess.check_output(
                  ["git", "show", f"{revision}:src-tauri/tauri.conf.json"]
              )

          original = show(signed)
          expected = original
          for before, after in (
              (b'"beforeDevCommand": "cd web && npm run dev"',
               b'"beforeDevCommand": "cd ../web && npm run dev"'),
              (b'"beforeBuildCommand": "cd web && npm run build"',
               b'"beforeBuildCommand": "cd ../web && npm run build"'),
          ):
              if expected.count(before) != 1:
                  raise SystemExit("signed desktop config has unexpected commands")
              expected = expected.replace(before, after)
          if show(build) != expected:
              raise SystemExit("desktop build source is not exactly PR #153's path fix")
          PY
          echo "commit=$BUILD_SOURCE" >> "$GITHUB_OUTPUT"

  build:
    needs: [delivery-gate, build-source]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate publish tag family
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-source.outputs.commit }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux deps (WebKitGTK)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build web dashboard
        run: cd web && npm ci && npm run build

      # App icons are gitignored (regenerated from the source PNG, §D0), so CI
      # must regenerate them before the bundle step or tauri build fails on a
      # missing icon. The source master is committed at
      # src-tauri/icons/source/duduclaw-1024.png (scripts/desktop/make-icon-master.py).
      - name: Generate app icons
        shell: bash
        run: |
          cargo install tauri-cli --version "^2" --locked
          cd src-tauri && cargo tauri icon icons/source/duduclaw-1024.png

      - name: Build & stage gateway sidecar
        shell: bash
        run: |
          cargo build --release -p duduclaw-cli --bin duduclaw --target ${{ matrix.target }}
          mkdir -p src-tauri/binaries
          EXT=""; [[ "${{ matrix.target }}" == *windows* ]] && EXT=".exe"
          cp "target/${{ matrix.target }}/release/duduclaw${EXT}" \
             "src-tauri/binaries/duduclaw-${{ matrix.target }}${EXT}"

      - name: Import Apple certificate
        if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build, sign & release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS notarization (handled by tauri-action when these are present)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "DuDuClaw Desktop ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          # tauri-action emits latest.json (updater manifest) when the updater
          # is configured — published alongside the installers (§D4.4).
          includeUpdaterJson: true

      # Windows signing — preferred: Azure Trusted Signing (cloud, ~US$10/mo,
      # no hardware token). See docs/guides/desktop-unblock.md 關卡 C 路徑 1.
      - name: Sign Windows installer (Azure Trusted Signing)
        if: matrix.os == 'windows-latest' && vars.WINDOWS_SIGN_METHOD == 'azure'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: src-tauri/target
          files-folder-filter: msi,exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Fallback: legacy .pfx (only for old stock / HSM-exported temp certs).
      # Enabled when repo var WINDOWS_SIGN_METHOD is unset or 'pfx'.
      - name: Sign Windows installer (legacy .pfx)
        if: matrix.os == 'windows-latest' && vars.WINDOWS_SIGN_METHOD != 'azure'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "No Windows signing configured — skipping (set WINDOWS_SIGN_METHOD=azure or provide a .pfx)."
            exit 0
          }
          Get-ChildItem -Recurse -Filter *.msi src-tauri/target |
            ForEach-Object { ./scripts/desktop/sign-windows.ps1 -Artifact $_.FullName }

  # The updater endpoint is the FIXED tag `desktop-updater` (§D4.4). It cannot
  # be `releases/latest/...` — core releases (v*) ship far more often than
  # desktop ones, so "latest" almost always points at a release with no
  # latest.json and the updater check would 404 forever. After all platform
  # builds land, republish the merged latest.json under the fixed tag.
  updater-manifest:
    needs: [build, build-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Republish latest.json under the desktop-updater tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --pattern latest.json --output latest.json
          if ! gh release view desktop-updater --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # prerelease so it never becomes the repo's "latest" release (the
            # install scripts resolve core binaries through /releases/latest).
            gh release create desktop-updater --repo "${{ github.repository }}" \
              --prerelease --title "Desktop updater manifest" \
              --notes "Moving pointer for the desktop auto-updater. latest.json here always describes the newest desktop release; installers live on the desktop-v* releases."
          fi
          gh release upload desktop-updater latest.json --repo "${{ github.repository }}" --clobber

      - name: Record desktop v1.75.0 rebuild provenance
        if: inputs.rebuild_v1750_desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          BUILD_SOURCE: ${{ needs.build-source.outputs.commit }}
        run: |
          cat > desktop-release-notes.md <<EOF
          Desktop installers for DuDuClaw v1.75.0.

          Signed delivery tag: \`desktop-v1.75.0\` (source \`b80df7f423f7bc2179f1ffb60f66d757aec5d323\`).
          Desktop build source: \`$BUILD_SOURCE\` ([PR #153](https://github.com/${{ github.repository }}/pull/153)).
          The build source differs from the signed tag only in Tauri's two web command paths. The signed tag and CLI release were not moved.
          EOF
          gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --notes-file desktop-release-notes.md

      # A desktop-v* release publishes minutes AFTER its paired CLI v* release,
      # so it steals the repo's "Latest" marker — /releases/latest then returns
      # an installer-only release and every deployed gateway's update check
      # mis-parses the tag (2026-07-29 field report: "vdesktop-v1.46.2" shown
      # as latest and wrongly reported up-to-date). Hand "Latest" back to the
      # CLI release; if it doesn't exist yet, just unmark this one.
      - name: Restore the CLI release as the repo's "Latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          CLI_TAG="${RELEASE_TAG#desktop-}"
          if gh release view "$CLI_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$CLI_TAG" --repo "${{ github.repository }}" --latest
          else
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --latest=false
          fi

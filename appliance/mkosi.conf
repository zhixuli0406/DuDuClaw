# DuDuClaw OS — mkosi top-level recipe.
#
# Builds one bootable GPT disk image: UEFI ESP + slot-A root (populated) +
# slot-B root (empty, reserved for the first `systemd-sysupdate` run) +
# /data (grows to fill the rest of the disk on real hardware). Partition
# layout lives in mkosi.repart/ (see that directory for the authoritative
# sizes/types); this file only covers distro selection, package list, and
# how the image boots.
#
# Setting names/sections verified against the upstream mkosi manual
# (2026-08, systemd/mkosi main branch):
#   https://github.com/systemd/mkosi/blob/main/mkosi/resources/man/mkosi.1.md
# Valid top-level sections are exactly: [Distribution] [Output] [Content]
# [Validation] [Build] [Runtime] — there is NO separate [Bootloader]
# section; Bootloader= lives under [Content].
#
# Architecture= below is the DEFAULT baked into this file (and what a bare
# `mkosi build` with no CLI override uses — the shipping target).
# appliance/build.sh overrides it per-build via the documented
# `Architecture=`, `--architecture=` CLI flag (mkosi manual, [Distribution]
# section) when `APPLIANCE_ARCH=arm64` is set; CLI overrides always win
# over file-configured settings per the manual's parsing-order rules ("the
# command line arguments are parsed" first, and "settings configured via
# the command line always override settings configured via configuration
# files"). The architecture-specific kernel package lives in
# mkosi.conf.d/10-arch-{x86-64,arm64}.conf (`[Match] Architecture=` +
# `Packages=`, see those files) rather than here, since Architecture=
# itself is a single-value setting that this default can't branch on.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
Output=duduclaw-os
# ImageId ends up in /usr/lib/os-release (VARIANT_ID) inside the built
# image — useful for `duduclaw doctor` / support scripts to recognize an
# appliance install vs a manual `duduclaw install`.
ImageId=duduclaw-os
# ImageVersion is read from mkosi.version by default; kept implicit here
# so `mkosi bump` (or manual edits to mkosi.version) is the single place
# that changes it.
CompressOutput=no
# SplitArtifacts is deliberately OFF: it would extract per-partition images
# by GPT type name, but the A/B dual-root layout (mkosi.repart/20-root-a +
# 21-root-b) has TWO partitions of the SAME type, so their split filenames
# collide and mkosi refuses ("have the same resolved split name ...,
# refusing"). The shippable artifact is the whole-disk duduclaw-os.raw
# (flashed to USB / booted in QEMU) — the split root images were only ever
# wanted for a future systemd-sysupdate PAYLOAD pipeline that doesn't exist
# yet. When that lands it needs per-slot SplitName= overrides in the repart
# drops (and the root-arm64 vs root-x86-64 type fix noted in those files),
# not this blanket setting.

[Content]
Bootable=yes
Bootloader=systemd-boot
# "auto" would silently fall back to unsigned UKIs if a signing key isn't
# configured; Secure Boot signing / TPM sealing isn't set up yet (see
# README.md "Explicitly out of scope"), so pin explicitly instead of
# relying on auto-detect masking that.
UnifiedKernelImages=yes
# Modules the UKI's kernel-modules initrd MUST contain to mount the root fs
# (2026-08-18: without these the initrd found /dev/gpt-auto-root but mount
# failed with status=32 and boot dropped to emergency). mkosi's default
# kernel-modules initrd includes only HOST-loaded modules, and the build
# runs in a container with none loaded, so ext4 (Debian arm64 builds it as
# a module, CONFIG_EXT4_FS=m) and the virtio storage transport were absent.
# mkosi resolves each listed module's dependencies automatically (ext4 pulls
# jbd2/mbcache/crc32c, virtio_blk pulls virtio/virtio_ring, ...).
KernelModulesInitrdInclude=ext4
                           jbd2
                           mbcache
                           crc32c_generic
                           crc16
                           crc32c
                           virtio
                           virtio_ring
                           virtio_blk
                           virtio_pci
                           virtio_mmio
                           virtio_scsi
                           virtio_console
# "ro" is belt-and-braces alongside root-a/b's repart ReadOnly=yes GPT
# attribute (mkosi.repart/20-root-a.conf) — two independent mechanisms
# enforcing the same read-only root, rather than trusting either alone.
# console=ttyS0,115200n8 (serial, first) + console=tty0 (local) is what
# lets smoke-qemu.sh capture boot output over QEMU's -serial stdio; harmless
# on real hardware (headless boxes have nothing attached to either).
# console=ttyAMA0,115200n8 is the same idea for an arm64 build: QEMU's
# `virt` machine (what smoke-qemu.sh uses for APPLIANCE_ARCH=arm64) exposes
# a PL011 UART — "Either one or two PL011 UARTs for the NonSecure World"
# (QEMU docs, docs/system/arm/virt.rst) — which Linux's amba-pl011 driver
# registers as /dev/ttyAMA0, not /dev/ttyS0 (that name is the 8250/16550
# ISA-style UART smoke-qemu.sh's x86-64 `q35` machine provides instead).
# Listing all three console= names in one shared cmdline is deliberate:
# whichever ones don't exist on the running machine are silently ignored
# by the kernel, so this line does not need to be architecture-gated via a
# mkosi.conf.d/ drop-in — it stays correct for both build targets as-is.
# systemd.log_target=kmsg + log_level + show_status=1 were diagnostic (used
# to route the initrd/boot failures onto the serial console while debugging
# the first boots) — restored to a support-friendly default. `quiet` is
# deliberately NOT set: an appliance benefits from visible boot progress on
# the serial console for field support. Console order puts the serial LAST
# so /dev/console (systemd's default log target) is the serial for a
# headless box; kernel printk still reaches tty0 too. `rw`: root-a is
# writable for now (the read-only-root + writable-/var hardening is a
# tracked follow-up, see README/design).
KernelCommandLine=systemd.show_status=auto rw console=tty0 console=ttyAMA0,115200n8 console=ttyS0,115200n8
# mkosi wires root=PARTUUID=<the partition it just built> into every UKI's
# cmdline automatically for disk-format builds with a root partition
# defined via repart (confirmed for the dm-verity case in the upstream
# docs; the plain non-verity case is documented as the same general
# mechanism but wasn't independently re-verified this round — see
# appliance/README.md "known open points").
# Multi-line continuation syntax (indented, no trailing commas) matches the
# verbatim Packages= example in the mkosi manual's [Content] section.
#
# The kernel package is deliberately NOT listed here — it's architecture-
# specific (`linux-image-amd64` on x86-64, `linux-image-arm64` on arm64;
# both confirmed against packages.debian.org, trixie, 2026-08) and lives in
# the two `[Match] Architecture=` drop-ins under mkosi.conf.d/ instead.
# `Packages=` is a collection setting — "This option may be used multiple
# times in which case the specified package lists are combined" (mkosi
# manual, [Content] section, `Packages=`) — so the drop-in's single package
# name is simply appended to this list at parse time, not a replacement.
#
# systemd-networkd was removed from this list (2026-08): it is NOT an
# installable Debian package in trixie (`apt-get install systemd-networkd`
# fails with "Unable to locate package" — confirmed via
# packages.debian.org's contents search: the `systemd-networkd` binary at
# /usr/lib/systemd/systemd-networkd is shipped inside the main `systemd`
# package, not a separate one; only systemd-resolved/systemd-timesyncd are
# still split out). `systemd` itself is pulled in transitively by every
# other package here (it's Debian's init system), so removing this line
# does not remove the binary or unit file — `systemctl enable
# systemd-networkd.service` in postinst.d/20-users-and-units.sh still
# works unchanged. This was a latent bug on EVERY architecture (not an
# arm64-specific finding), caught while verifying arm64 package
# availability for this round's other Packages= entries.
Packages=systemd-boot-efi
         systemd-boot-tools
         systemd-timesyncd
         systemd-resolved
         nftables
         avahi-daemon
         docker.io
         nodejs
         npm
         python3
         python3-venv
         python3-pip
         e2fsprogs
         dosfstools
         ca-certificates
         curl
         less
         openssh-server
         dbus
         tzdata
         cage
         chromium
         seatd
         login
         mesa-vulkan-drivers
         fonts-noto-cjk
         fonts-noto-color-emoji

# cage / chromium / seatd: the detection-gated kiosk display session (see
# mkosi.extra/etc/systemd/system/duduclaw-kiosk.service — off in effect on
# every headless boot, on only when a display is actually attached; this
# does NOT change any headless behavior). Package names + exact versions
# confirmed against packages.debian.org, trixie, 2026-08:
#   cage      0.2.0-2   "Kiosk compositor for Wayland" — pulls in
#             libwlroots-0.18 and xwayland transitively, not hand-listed
#             here (same convention as docker.io/nodejs above: apt
#             resolves the dependency tree, we only list the thing we
#             actually asked for).
#   chromium  151.0.7922.137-1~deb13u1 — dominates the image-size delta;
#             see README.md for the (estimated) size/RAM cost.
#   login / mesa-vulkan-drivers / fonts-noto-cjk / fonts-noto-color-emoji
#             (Shell-S2 wave, 2026-08-20, all four verified live in the VM
#             rounds — crates/duduclaw-shell/BUILD-LINUX.md stage B-③):
#             `login` fixes a REAL bug found there: this minimal image
#             never installed /bin/login, so agetty's login exec died
#             instantly and serial-getty restart-looped — meaning the
#             APPLIANCE_DEBUG serial root login documented in README.md
#             could never have worked on any build to date, password set
#             or not. `mesa-vulkan-drivers` is what the gpui shell's
#             renderer actually needs (blade speaks Vulkan; lavapipe on
#             boxes with no Vulkan-capable GPU — cage's own GL stack is
#             NOT sufficient), `fonts-noto-cjk` is the shell's zh-TW text
#             (it ships no fonts of its own), and `fonts-noto-color-emoji`
#             fixes the emoji tofu observed in the Chromium dashboard
#             kiosk (no emoji-capable font anywhere in the image).
#   seatd     0.9.1-1 — NOT auto-pulled despite being a real runtime need
#             of libwlroots-0.18's libseat1 dependency: libseat1's own
#             Depends is the alternative "seatd | logind", and Debian's
#             package listing for libseat1 shows the "logind" side of
#             that alternative as unsatisfiable in this suite (nothing
#             here declares `Provides: logind` — that virtual package
#             name belongs to elogind, which this image doesn't install;
#             real systemd-logind, which this image DOES have as part of
#             the systemd package, doesn't provide it). apt would
#             probably still resolve to seatd on its own, but listing it
#             explicitly matches this file's existing philosophy (ToolsTree=
#             comment above, ExtraTrees= comment below): one explicit
#             source of truth, not a dependency-resolution assumption.

# Reuses mkosi.repart/ (already the RepartDirectories= for building the
# disk's partition table, auto-discovered per mkosi's "If mkosi.repart/
# exists in the local directory, it will be used for this purpose as well")
# as a SECOND thing: plain files copied into the running image at
# /usr/lib/repart.d/, so systemd-repart re-applies the exact same
# definitions against the real disk at first real boot (see
# mkosi.extra/usr/local/sbin/duduclaw-firstboot-repart.sh — that's the
# "systemd-repart 擴 /data 吃滿磁碟" step). One directory, one source of
# truth, instead of hand-duplicating four small files into mkosi.extra/
# and risking them drifting apart from the build-time definitions.
# ExtraTrees= "SOURCE:TARGET" colon-pair syntax verified against the
# upstream mkosi manual, 2026-08.
ExtraTrees=mkosi.repart:/usr/lib/repart.d

# Post-install: create the system users and enable the units. The AI CLIs
# (claude-code/codex/gemini-cli) are NOT installed here — mkosi's postinst
# sandbox has no outbound network, so they are vendored in a Docker build
# (appliance/Dockerfile.cli-vendor) and copied into /usr/local via build.sh's
# ExtraTree instead. PostInstallationScripts= "takes a comma-separated list
# of paths to executables" (mkosi manual, [Content] section).
PostInstallationScripts=postinst.d/20-users-and-units.sh

[Build]
# Build tools (mkfs.*, bootctl, systemd-repart, ...) come from a dedicated
# mkosi-built tools tree instead of whatever happens to be installed on the
# Docker build host — this is what makes the image reproducible when
# building via container/Docker on macOS.
#
# NO ToolsTree — deliberately (two real failures, 2026-08-18): mkosi 25.3's
# syntax is `default` not the main-branch-documented `yes` (25.3 treats
# `yes` as a literal path), and 25.3's tools-tree bootstrap hard-requires
# `?exact-name(grub-pc-bin)` — an x86-BIOS-only package that does not exist
# on arm64, so any arm64 build dies inside the tools tree before touching
# our image. The canonical build path is the Dockerfile.mkosi-runner
# container, which IS the controlled toolbox (explicit build-tool install
# list there, hard-fail if missing); native-Linux community builds use the
# host's tools — documented in README, acceptable for A-prime self-builders.

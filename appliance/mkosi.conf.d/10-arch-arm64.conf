# Architecture-gated kernel package — arm64 half.
#
# See 10-arch-x86-64.conf in this same directory for the full citation of
# how mkosi.conf.d/ drop-ins, `[Match] Architecture=`, and the `Packages=`
# collection-merge semantics are documented upstream — this file mirrors
# that one exactly, just for the other supported APPLIANCE_ARCH value.
#
# linux-image-arm64: confirmed present in Debian trixie as an arm64-only
# meta-package ("depends on the latest Linux kernel and modules for use
# on 64-bit ARMv8 machines", packages.debian.org, 2026-08) — this is the
# arm64 build target's equivalent of x86-64's linux-image-amd64. arm64
# builds are for local Apple Silicon native builds + QEMU smoke testing
# (see appliance/README.md); x86-64 remains the shipping target.
[Match]
Architecture=arm64

[Content]
Packages=linux-image-arm64

# Architecture-gated kernel package — x86-64 half.
#
# mkosi.conf.d/ drop-ins are parsed automatically alongside mkosi.conf
# ("`mkosi.conf.d/` is parsed in the same directory as `mkosi.conf` if it
# exists. Each directory and each file with the `.conf` extension in
# `mkosi.conf.d/` is parsed" — mkosi manual, "Configuration is parsed in
# the following order"). `[Match]` at the top of a file gates the whole
# file: "The `[Match]` section of a `mkosi.conf` file in a directory
# applies to the entire directory" — the same applies to a single
# drop-in file's own leading `[Match]` section (verified against the
# mkosi manual's `[Match]` section documentation, 2026-08).
#
# `Architecture=` in `[Match]` "Matches against the configured
# architecture. If this condition is used and no architecture has been
# explicitly configured yet, the host architecture is used." — since
# appliance/mkosi.conf's own `[Distribution] Architecture=x86-64` is
# parsed before this drop-in (mkosi.conf.d/ is parsed after mkosi.conf
# per the ordering above) and build.sh's `--architecture=` CLI override
# is parsed before configuration files, the match always sees the
# final resolved architecture, not a stale default.
#
# `Packages=` is a collection setting: "This option may be used multiple
# times in which case the specified package lists are combined" (mkosi
# manual, `[Content]` `Packages=`) — so this single line appends to, not
# replaces, the `Packages=` list already parsed from mkosi.conf.
#
# linux-image-amd64: confirmed present in Debian trixie, amd64-only
# (packages.debian.org, 2026-08) — this is the package already used
# before architecture parameterization existed.
[Match]
Architecture=x86-64

[Content]
Packages=linux-image-amd64

#!/usr/sbin/nft -f
# DuDuClaw OS default firewall — deny inbound by default, nothing is
# reachable from outside the LAN out of the box. Loaded by
# nftables.service at boot (stock unit shipped by the `nftables` Debian
# package; explicitly enabled in postinst.d/20-users-and-units.sh —
# this file is its ExecStart target).
#
# DASHBOARD_PORT must match the gateway's [gateway] port / DUDUCLAW_PORT
# (default 18789 — crates/duduclaw-core/src/config.rs). If a future
# dashboard "change port" control ships, this file needs the same value
# written alongside it — there's no live templating here, it's a build-time
# constant.

flush ruleset

define DASHBOARD_PORT = 18789

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		icmp type { echo-request, destination-unreachable, time-exceeded } accept
		icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, destination-unreachable, time-exceeded, packet-too-big } accept

		udp dport 5353 accept comment "mDNS — Avahi duduclaw.local discovery"
		tcp dport $DASHBOARD_PORT accept comment "DuDuClaw dashboard (LAN)"

		# SSH is installed but disabled by default (see
		# mkosi.skeleton/etc/systemd/system-preset/99-duduclaw.preset).
		# No port 22 rule here on purpose — when a future dashboard toggle
		# enables sshd it also needs to add this rule (or an operator adds
		# it manually); firewall stays deny-by-default even if the service
		# gets turned on some other way.
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

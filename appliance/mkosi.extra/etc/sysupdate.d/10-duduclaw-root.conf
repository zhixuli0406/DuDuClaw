# A/B root partition update transfer (systemd-sysupdate).
#
# Source is a local staging directory, not a remote URL: a signed remote
# update channel is explicit future work, not this recipe's scope (see
# README.md "Explicitly out of scope"). Whatever the eventual
# operator-facing update command turns out to be, it's expected to
# fetch+verify the signed payload into /var/lib/duduclaw/updates/ first,
# then invoke `systemd-sysupdate update` — this file only defines the
# transfer shape, not how the bytes get onto local disk.
#
# Directive names verified against sysupdate.d(5) (2026-08, man7.org
# mirror of the upstream systemd manual). MatchPartitionType= is a generic
# directive (any GPT type, not verity-specific) — quoting the manual:
# "specifies the GPT partition type to look for... If not specified, the
# GPT partition type linux-generic is used."
#
# InstancesMax=2 matches the fixed two-slot layout in mkosi.repart/
# (20-root-a.conf / 21-root-b.conf) — sysupdate never tries to keep more
# than the two pre-allocated slots.
[Transfer]
ProtectVersion=%A

[Source]
Type=regular-file
Path=/var/lib/duduclaw/updates
MatchPattern=duduclaw-os_@v.root-x86-64.raw

[Target]
Type=partition
Path=auto
MatchPattern=duduclaw-os_@v
MatchPartitionType=root-x86-64
PartitionFlags=0
ReadOnly=1
InstancesMax=2

# Unified Kernel Image update transfer (systemd-sysupdate) — the paired
# half of 10-duduclaw-root.conf. Each released version ships both a root
# partition payload and a matching UKI; sysupdate installs them together
# (same @v version token) so a UKI is never left pointing at a root
# partition from a different version.
#
# PathRelativeTo=esp anchors Path=/EFI/Linux to wherever the ESP is
# actually mounted (systemd-gpt-auto-generator picks /efi — see
# appliance/mkosi.extra/etc/fstab's comment on why root/ESP have no
# explicit fstab entries) instead of hardcoding a mount path here.
#
# KNOWN OPEN POINT (see appliance/README.md): the exact mechanics of how
# systemd-boot's boot-counting filename suffix (`+tries_left-tries_done`)
# gets applied to a UKI sysupdate just wrote, and how that interacts with
# systemd-bless-boot.service marking a boot successful, were not
# independently re-verified this round beyond confirming both pieces exist
# upstream — needs a real A/B update + forced-failure rollback test on the
# QEMU/hardware round.
[Transfer]
ProtectVersion=%A

[Source]
Type=regular-file
Path=/var/lib/duduclaw/updates
MatchPattern=duduclaw-os_@v.efi

[Target]
Type=regular-file
Path=/EFI/Linux
PathRelativeTo=esp
MatchPattern=duduclaw-os_@v.efi
Mode=0444
InstancesMax=2

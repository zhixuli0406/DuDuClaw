# DuDuClaw OS — additional Flatpak system installation, rooted on /data.
#
# WHY THIS FILE EXISTS AT ALL, AND WHY IT IS STATIC IMAGE CONTENT rather
# than something written at first boot: flatpak resolves its installation
# list at startup, and the repository layout is created by the FIRST
# `flatpak install`. If that first install happens before this file is in
# place, the whole OSTree object store lands in /var/lib/flatpak — i.e. on
# the fixed-size 5G read-only root, which had under 1.4GB free before the
# A4 wave even added the compositor binary. A single Chromium plus the
# freedesktop runtime measured 2.4GB on disk (measured `du`, not the
# Flathub estimate, which understates by ~2x because it omits the OSTree
# object-store overhead plus the GL/locale/codecs extension runtimes) —
# one app does not fit on root, let alone a catalogue. /data is the
# partition with no SizeMaxBytes= and GrowFileSystem=yes
# (mkosi.repart/30-data.conf), so it is the only correct home for this.
#
# Format and semantics are flatpak's own documented mechanism, not a
# bind-mount workaround: flatpak-installation(5) reads INI files from
# /etc/flatpak/installations.d/, where the section name after
# `Installation` is the name passed to `--installation=NAME`, and `Path=`
# is the only required key.
#
# CONSEQUENCE WORTH KNOWING BEFORE YOU TYPE A COMMAND: this defines an
# ADDITIONAL installation; it does not move the default one. A bare
# `flatpak install <app>` still targets the default system installation at
# /var/lib/flatpak — i.e. root — and will fill it. Every DuDuClaw code path
# and every support command must pass `--installation=data`. See
# /usr/local/sbin/duduclaw-flatpak-setup.sh, which sets up the remote in
# exactly this installation.
#
# /data/flatpak itself is created by that setup script (this image cannot
# create it: /data is an empty partition until the first boot mounts it).
[Installation "data"]
Path=/data/flatpak
DisplayName=DuDuClaw app storage (/data)
StorageType=harddisk

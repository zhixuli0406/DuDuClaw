# EFI System Partition — holds systemd-boot + the UKIs for both A/B slots.
#
# Sized for 2-3 UKIs (~150-250MB each once kernel+initrd+cmdline are bundled)
# plus systemd-boot itself, with headroom for a third UKI mid-update (the
# old slot's UKI isn't deleted until the new one is confirmed booting).
#
# This directory is also copied into the running OS at /usr/lib/repart.d/
# (mkosi.conf's ExtraTrees=mkosi.repart:/usr/lib/repart.d) so
# systemd-repart re-evaluates the same layout on real hardware after the
# golden image is written to a larger disk — this definition is a no-op
# there (ESP is already the right size), only 30-data.conf actually grows.
#
# Directive names verified against repart.d(5) (2026-08, man.archlinux.org
# mirror of the upstream systemd manual):
#   https://man.archlinux.org/man/repart.d.5
[Partition]
Type=esp
Format=vfat
SizeMinBytes=512M
SizeMaxBytes=1G
# Populate the ESP (2026-08-18: without these it was formatted but left
# EMPTY, so the firmware found nothing bootable and fell through to PXE).
# mkosi installs the bootloader into the image's /efi
# (EFI/systemd/systemd-bootaa64.efi + the removable-media fallback
# EFI/BOOT/BOOTAA64.EFI + loader/) and the UKIs into /boot/EFI/Linux; with a
# single ESP (no separate XBOOTLDR partition) both must be copied into this
# partition. Type#2 UKIs under /EFI/Linux are auto-discovered by
# systemd-boot, so no loader/entries are needed.
CopyFiles=/efi:/
CopyFiles=/boot/EFI:/EFI

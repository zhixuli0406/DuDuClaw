# /data — everything mutable: ~/.duduclaw, Docker's storage dir, model
# files, agent working state. Survives base image A/B slot switches and
# rollbacks untouched — a broken base update never touches user data,
# because the two live on physically separate partitions.
#
# Type=linux-generic (the generic "Linux filesystem data" GPT type) is
# deliberate, NOT Type=home/var/srv — those three have their own
# Discoverable-Partitions-Spec auto-mount targets (/home, /var, /srv) that
# we don't want; linux-generic requires an explicit fstab entry, which we
# provide (mkosi.extra/etc/fstab) so it mounts at /data under our control.
#
# No SizeMaxBytes= and the highest Weight= of any partition in this
# directory: on the small golden image built by mkosi (4G here, just
# enough for the build itself) it gets whatever's left after ESP+root-a+
# root-b's fixed sizes; on real hardware, after the golden image is
# written to a bigger disk and systemd-repart re-evaluates this same
# definition (mkosi.conf's ExtraTrees=mkosi.repart:/usr/lib/repart.d
# copies this directory into the image itself), it expands to consume the
# rest of the disk. That re-evaluation is the "grow /data to fill the
# disk" first-boot step — see
# mkosi.extra/usr/local/sbin/duduclaw-firstboot-repart.sh.
[Partition]
Type=linux-generic
Label=duduclaw-data
Format=ext4
SizeMinBytes=4G
Weight=1000
GrowFileSystem=yes

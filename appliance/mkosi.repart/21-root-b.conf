# Root slot B — reserved empty, same size as slot A, no CopyFiles/Format.
#
# Left unformatted on purpose: systemd-sysupdate's partition target (see
# mkosi.extra/etc/sysupdate.d/10-duduclaw-root.conf) writes a raw
# filesystem image straight into this partition with `dd`-equivalent
# semantics — there's no mkfs step at update time, so pre-formatting here
# would just be discarded.
#
# Pre-allocating this slot at build/install time (instead of relying on
# systemd-sysupdate to grow the partition table on first update) is the
# more conservative choice for a scaffold: it doesn't depend on verifying
# sysupdate's on-demand-partition-creation behavior for the partition
# target type, which this round did not independently confirm — see
# appliance/README.md "known open points".
# NoAuto=yes is LOAD-BEARING (2026-08-18): both root-a and root-b are
# Type=root (→ root-arm64), so systemd's gpt-auto-generator sees TWO
# candidate root partitions and its choice is ambiguous — it picked this
# empty slot and boot failed to mount (status=32, dropped to emergency).
# NoAuto sets the GPT "no-auto" attribute so the discoverable-partitions
# root autodiscovery skips slot B entirely, leaving slot A the only
# candidate on a fresh boot. When systemd-sysupdate later populates slot B
# and switches to it, clearing this attribute (and setting it on slot A) is
# part of that switch — deferred with the rest of the sysupdate wiring
# (see appliance/README.md "known open points").
[Partition]
Type=root
Label=duduclaw-root-b
# 4G -> 5G (2026-08-20, Shell-S2 kiosk wave): the gpui-shell kiosk additions
# (mesa-vulkan-drivers incl. libLLVM, fonts-noto-cjk, fonts-noto-color-emoji,
# login, the duduclaw-shell binary) overflowed the 4G root at mkfs populate
# time ("No space left on device while populating file system"). Clean root
# was ~3.0G; the additions are ~0.6G. Both root partitions move together —
# A/B slots must stay identical for sysupdate.
SizeMinBytes=5G
SizeMaxBytes=5G
ReadOnly=yes
NoAuto=yes

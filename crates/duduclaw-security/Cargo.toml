[package]
name = "duduclaw-security"
version.workspace = true
edition.workspace = true

[dependencies]
duduclaw-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
zeroize = "1"
unicode-normalization = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1.12"
regex = "1"

[features]
default = []
# WP-H1 P1 — `secret://keychain/<service>/<account>`. A pure passthrough to
# `duduclaw-core`'s own optional `keyring` dependency; no new crate is added.
# Off by default so the standard build links no native credential-store code.
keychain = ["duduclaw-core/keychain"]

[package]
name = "duduclaw-import"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = "0.10"
toml.workspace = true
duduclaw-isolation.workspace = true
# RM-173: the legacy archived-conversation classification shared with the
# gateway (`duduclaw_core::session_legacy`), so both always agree on a row.
duduclaw-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { workspace = true, features = ["hooks", "limits", "modern_sqlite"] }
tempfile = "3"
rustix = { version = "1", features = ["fs", "process", "thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true

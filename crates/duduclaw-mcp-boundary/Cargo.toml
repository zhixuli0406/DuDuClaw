[package]
name = "duduclaw-mcp-boundary"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
execution-integration = ["dep:duduclaw-execution"]
binding-store = ["dep:rusqlite"]
# Exposes resources::test_broker::TestWorkBroker for downstream tests (H5/H11).
test-support = []

[dependencies]
duduclaw-isolation.workspace = true
duduclaw-execution = { workspace = true, optional = true }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3"
url = "2"
tokio.workspace = true
rusqlite = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "net"] }
libc = "0.2"

[dev-dependencies]

[lints]
workspace = true

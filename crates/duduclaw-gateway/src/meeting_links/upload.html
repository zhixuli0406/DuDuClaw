<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>會議逐字稿</title>
<style>html{font:17px/1.65 system-ui;color:#102b48;background:#f5f4f0}body{max-width:560px;margin:10vh auto;padding:24px}h1{font-size:26px}input,button{font:inherit;margin:12px 0}button{padding:10px 22px;background:#102b48;color:white;border:0;border-radius:10px}progress{width:100%}p{overflow-wrap:anywhere}small{color:#586574}</style>
<h1 id="title">會議逐字稿</h1><p id="employee"></p><small id="privacy"></small><p><input id="file" type="file" accept="audio/*,video/*" disabled></p><button id="send" disabled>上傳並轉錄</button><progress id="progress" value="0" max="100"></progress><p id="status" role="status" aria-live="polite"></p>
<script>
'use strict';
const locale=navigator.language.toLowerCase();const copy=locale.startsWith('ja')?{title:'会議の文字起こし',send:'アップロードして文字起こし',privacy:'ファイルは管理者が設定した文字起こしサービスに送信されます。',ready:'ファイルを選択してください。',invalid:'このリンクは無効、期限切れ、または使用済みです。',size:'ファイルが空か、サイズ上限を超えています。',different:'前回と同じファイルを選択してください。',done:'アップロードが完了しました。処理が終わると元の会話に通知します。',retry:'アップロードできませんでした。同じファイルを選択して再試行してください。'}:locale.startsWith('en')?{title:'Meeting transcript',send:'Upload and transcribe',privacy:'Audio is sent to the transcription service configured by your administrator.',ready:'Choose your recording.',invalid:'This link is invalid, expired, or already used.',size:'The file is empty or exceeds the size limit.',different:'Select the same file to resume.',done:'Upload complete. A notification will appear in the original conversation when transcription finishes.',retry:'Upload failed. Select the same file and try again.'}:{title:'會議逐字稿',send:'上傳並轉錄',privacy:'錄音會送至管理員設定的轉錄服務。',ready:'請選擇錄音或影片。',invalid:'這個連結已失效、過期或已使用，請在原對話索取新連結。',size:'檔案為空或超過大小上限。',different:'請選擇上次未完成上傳的同一個檔案。',done:'上傳完成。逐字稿處理完畢後，會在原對話通知你。',retry:'上傳中斷，請選擇同一個檔案後重試。'};
const $=id=>document.getElementById(id);$('title').textContent=copy.title;document.title=copy.title;$('send').textContent=copy.send;$('privacy').textContent=copy.privacy;
const token=location.hash.slice(1);const base=location.pathname.replace(/\/meeting-upload\/?$/,'');const api=base+'/api/meeting-link';let meta;
async function request(path,options={}){const response=await fetch(api+path,{...options,credentials:'omit',referrerPolicy:'no-referrer',headers:{'x-meeting-upload-token':token,...options.headers}});const value=await response.json();if(!response.ok)throw new Error(value.message||copy.retry);return value;}
async function refresh(){try{meta=await request('');$('employee').textContent=meta.employee_name;$('file').disabled=false;$('send').disabled=false;$('status').textContent=copy.ready;}catch{$('status').textContent=copy.invalid;}}
$('send').onclick=async()=>{const file=$('file').files[0];if(!file)return;if(!file.size||file.size>meta.max_bytes){$('status').textContent=copy.size;return;}$('send').disabled=true;$('file').disabled=true;try{meta=await request('');let upload=meta.upload||await request('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({size:file.size})});const chunkSize=upload.chunk_size;const received=new Set(upload.received||[]);for(let i=0;i<Math.ceil(file.size/chunkSize);i++){const blob=file.slice(i*chunkSize,Math.min(file.size,(i+1)*chunkSize));const bytes=await blob.arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');if(received.has(i)){if(upload.hashes?.[String(i)]!==hash)throw new Error(copy.different);}else{await request('/chunks/'+i,{method:'PUT',headers:{'x-chunk-sha256':hash,'content-type':'application/octet-stream'},body:bytes});}$('progress').value=Math.round(Math.min(file.size,(i+1)*chunkSize)*100/file.size);$('status').textContent=$('progress').value+'%';}await request('/complete',{method:'POST'});$('status').textContent=copy.done;}catch(error){$('status').textContent=error.message||copy.retry;$('send').disabled=false;$('file').disabled=false;}};
if(/^[0-9a-f]{64}$/.test(token)&&crypto.subtle){refresh();}else{$('status').textContent=copy.invalid;}
</script></html>

<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建立管理員 · DuDuClaw</title>
<style>body{font:17px system-ui;max-width:30rem;margin:10vh auto;padding:1.5rem;background:#faf9f6;color:#182638}label{display:block;margin:1rem 0}input,button{font:inherit;box-sizing:border-box;width:100%;padding:.7rem}button{cursor:pointer}#result{white-space:pre-wrap}</style>
<h1 id="title">建立第一位管理員</h1><p id="intro">設定連結只能使用一次，30 分鐘後失效。建立帳號後，請登入並逐項確認遷移資料。</p>
<form id="setup"><label><span id="email-label">電子郵件</span><input id="email" type="email" maxlength="320" autocomplete="username" required></label><label><span id="name-label">顯示名稱</span><input id="name" maxlength="256" autocomplete="name" required></label><label><span id="password-label">密碼（至少 12 個字元）</span><input id="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required></label><button id="submit" type="submit">建立管理員</button></form><p id="result" role="status"></p><a id="login" href="/login" hidden>登入</a>
<script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
const messages={en:['Create the first administrator','This link can be used once and expires after 30 minutes. Sign in after creating your account to review migrated data.','Email','Display name','Password (at least 12 characters)','Create administrator','Account created. Sign in to review migrated data.','The link is invalid, expired, or could not be claimed. Ask the administrator to issue a new link.','Sign in'],ja:['最初の管理者を作成','このリンクは1回のみ使用でき、30分で期限切れになります。作成後にログインして移行データを確認してください。','メールアドレス','表示名','パスワード（12文字以上）','管理者を作成','作成しました。ログインして移行データを確認してください。','リンクが無効、期限切れ、または使用できません。管理者に新しいリンクを依頼してください。','ログイン'],zh:['建立第一位管理員','設定連結只能使用一次，30 分鐘後失效。建立帳號後，請登入並逐項確認遷移資料。','電子郵件','顯示名稱','密碼（至少 12 個字元）','建立管理員','帳號已建立，請登入並逐項確認遷移資料。','連結無效、已過期或無法領取，請管理員重新產生設定連結。','登入']};
const lang=navigator.language.startsWith('ja')?'ja':navigator.language.startsWith('zh')?'zh':'en';const t=messages[lang];['title','intro','email-label','name-label','password-label','submit'].forEach((id,i)=>document.getElementById(id).textContent=t[i]);document.getElementById('login').textContent=t[8];
document.getElementById('setup').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit');button.disabled=true;try{const response=await fetch('/api/migration/setup/claim',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'omit',body:JSON.stringify({token,email:document.getElementById('email').value,display_name:document.getElementById('name').value,password:document.getElementById('password').value})});if(!response.ok)throw Error();document.getElementById('password').value='';document.getElementById('setup').hidden=true;document.getElementById('result').textContent=t[6];document.getElementById('login').hidden=false;}catch{document.getElementById('result').textContent=t[7];button.disabled=false;}});
</script></html>

[package]
name = "duduclaw-gateway"
version.workspace = true
edition.workspace = true

[dependencies]
# H4/H5 (WP-B goal loop hardening): gap-fingerprint path:line extraction +
# the bail-pattern regex panel. Already a direct dependency elsewhere in the
# workspace (duduclaw-cli, duduclaw-security, duduclaw-redaction), so no new
# transitive units.
regex = "1"
duduclaw-core = { workspace = true }
duduclaw-auth = { workspace = true }
duduclaw-agent = { workspace = true }
duduclaw-fork = { workspace = true }
duduclaw-memory = { workspace = true }
duduclaw-security = { workspace = true }
duduclaw-container = { workspace = true }
duduclaw-odoo = { workspace = true }
duduclaw-identity = { workspace = true }
duduclaw-redaction = { workspace = true }
duduclaw-cli-runtime = { workspace = true }
duduclaw-cli-worker = { workspace = true }
duduclaw-license = { workspace = true }
duduclaw-os = { workspace = true }
duduclaw-llm = { workspace = true }
duduclaw-sandbox = { workspace = true }
# N-0: SysdDeviceOps client (UDS to the appliance's privilege-separated
# duduclaw-sysd root service) — see device_ops.rs.
duduclaw-sysd = { workspace = true }
thiserror = { workspace = true }
# WP2.2 eval_runner.rs: subprocess spawn/parse error wrapping (B1 cli↔gateway
# boundary — the eval harness is driven out-of-process). Already a workspace
# dependency used elsewhere in the tree, just not previously a direct dep here.
anyhow = { workspace = true }
tokio-util = "0.7"
# Interactive CLI auth ("Dashboard 一鍵登入") drives each AI CLI's native login
# command in a PTY. Same crate the cli-runtime uses, so no new transitive deps.
portable-pty = "0.9"
chrono = { workspace = true }
chrono-tz = { workspace = true }
cron = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# Comment-preserving TOML edits for premium team-template staging (already the
# engine underneath `toml` 0.8, so no new transitive deps).
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }
reqwest = { version = "0.12", features = ["json", "multipart"] }
# Email channel — async SMTP send (rustls, aligns with the workspace TLS stack).
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
# Slack Socket Mode URL validation (already in the tree via reqwest — no new compile units)
url = "2"
# web_extract L2 CSS-selector extraction (same version as duduclaw-cli)
scraper = "0.22"
rusqlite = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
# WeCom (企業微信) callback crypto — SHA1 msg_signature + AES-256-CBC message
# envelope (wecom.rs). Both crates are already in Cargo.lock as transitive
# deps (sha1 via ring-adjacent stacks, aes via aes-gcm), so no new units.
sha1 = "0.10"
aes = "0.8"
base64 = { workspace = true }
# White-label About-block HTML sanitization (branding.rs §10.2).
ammonia = { workspace = true }
jsonwebtoken = "9"
ring = { workspace = true }
futures-util = { workspace = true }
tempfile = "3"
zeroize = "1"
unicode-normalization = "0.1"
flate2 = "1"
tar = "0.4"
dirs = "5"
hostname = "0.4"
# LAN gateway advertising (mdns.rs) — see workspace dep for rationale.
mdns-sd = { workspace = true }
# Self-update release-asset signature verification (updater.rs [S1])
minisign-verify = "0.2"
# A2A v1.0 signed Agent Card — EdDSA/JWS signing (a2a_signing.rs). Same crate
# convention as duduclaw-license; `rand_core` enables SigningKey::generate for
# first-run key material. Signing (not just verify) so full feature set here.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand = "0.8"

duduclaw-inference = { workspace = true }
duduclaw-desktop = { workspace = true, optional = true }
duduclaw-dashboard = { workspace = true, optional = true }
async-trait = { workspace = true }

# L5b native desktop control. Screen capture lives in `duduclaw-desktop`
# (OS-native tool shell-out); the gateway no longer needs `xcap` directly.
enigo = { version = "0.3", features = ["serde"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
hex = "0.4"
openssl-sys = { version = "0.9", optional = true }
# WP-4H: delivery-gate zip-container integrity check for docx/xlsx/pptx
# (OOXML packages). Was Windows-only (`updater.rs`'s zip-extraction path);
# promoted to a normal cross-platform dependency so `artifact_gate.rs` can
# validate on macOS/Linux too — same crate/version/features, just no longer
# target-gated.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# "fs" (statvfs) + "net" (ifaddrs) added for WP-B appliance `device.status`
# disk/network readings (crates/duduclaw-gateway/src/device.rs) — both are
# available cross-Unix, not Linux-only, per nix's own feature gating.
# "user" added for N-0's device_ops sysd integration tests (nix::unistd::Uid::current()).
nix = { version = "0.29", features = ["signal", "process", "fs", "net", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
# WP-CD4a (CD-4 C-L2 app registry, `codrive/registry.rs`): read-only
# NetworkManager D-Bus queries (`connectivity`/`state`). Target-gated the
# same way `duduclaw-shell/Cargo.toml`'s own `zbus` dependency already is —
# see that file's header comment for the full "why Linux-only" reasoning,
# which applies verbatim here: co-drive is a Linux-appliance-only feature to
# begin with (`duduclaw-comp` itself only runs on Linux; `codrive/client.rs`
# already has a non-unix stub), so on every other target `zbus`'s entire
# dependency tree (async-io, futures-util, nix's zbus-internal usage, ...)
# never enters this crate's build graph at all. Verified with `cargo tree -p
# duduclaw-gateway --target <host-triple> -i zbus` (absent) vs `--target
# x86_64-unknown-linux-gnu -i zbus` (present) before landing this — see the
# WP-CD4a report for the exact before/after.
zbus = "5"

# WP-CD4b (CD-4 C-L3 AT-SPI2 semantic layer, `codrive/atspi_locate.rs`):
# pure-Rust, zbus-based AT-SPI2 client — locates a GTK/Qt control by
# role+name over the Linux accessibility ("a11y") D-Bus bus and returns its
# on-screen extents for the existing C-L1 coordinate dispatch to click.
# Target-gated the same way the WP-CD4a `zbus` dependency directly above is
# (see its comment for the full "why Linux-only" reasoning, which applies
# verbatim — co-drive is a Linux-appliance-only feature to begin with).
# Default features (`connection`, `proxies`, `p2p`, `wrappers`) pull in
# `atspi-connection`/`atspi-proxies`/`atspi-common` on top of the SAME
# `zbus 5.x` this crate already depends on above, not a second copy —
# verified with `cargo tree -p duduclaw-gateway --target
# x86_64-unknown-linux-gnu -i zbus` showing a single `zbus v5.19.0` node.
# Mac zero-new-compile verified with `cargo tree -p duduclaw-gateway -i
# atspi` (absent on the default host target) — see the WP-CD4b report.
atspi = "0.30"

# Discord voice channel support (Songbird)
songbird = { version = "0.5", optional = true, features = ["driver", "rustls", "receive"] }

# OpenTelemetry GenAI tracing + OTLP export (feature "otel", default OFF —
# zero deps / zero overhead when disabled; spans are plain `tracing` either
# way, the feature only compiles the OTLP export layer in src/otel.rs).
# grpc-tonic transport (default) keeps us off reqwest 0.13 (otlp's http default
# would duplicate the gateway's reqwest 0.12). tls-webpki-roots supports HTTPS
# gRPC collectors (Langfuse/Grafana Cloud). Mutually-compatible 0.32/0.33 set.
opentelemetry = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "tls-webpki-roots"], optional = true }
tracing-opentelemetry = { version = "0.33", default-features = false, optional = true }
# Already in the otel tree via opentelemetry-otlp's grpc-tonic transport; named
# directly only for tonic::metadata::MetadataKey (non-panicking header insert).
tonic = { version = "0.14", default-features = false, optional = true }

[features]
default = ["dashboard", "desktop"]
desktop = ["dep:duduclaw-desktop", "dep:enigo"]
dashboard = ["dep:duduclaw-dashboard"]
vendored-openssl = ["openssl-sys/vendored"]
metal = ["duduclaw-inference/metal"]
cuda = ["duduclaw-inference/cuda"]
vulkan = ["duduclaw-inference/vulkan"]
mistralrs-metal = ["duduclaw-inference/mistralrs-metal"]
mistralrs-cuda = ["duduclaw-inference/mistralrs-cuda"]
discord-voice = ["dep:songbird"]
# OpenTelemetry GenAI tracing + OTLP export (see src/otel.rs). Default OFF.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tonic",
]

[dev-dependencies]
tempfile = "3"
# P2 license control-plane integration tests need to name the license types and
# encode signatures against the clean (non-test) lib build.
duduclaw-license = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand = "0.8"
# WP-E2 relay client protocol-compat test: spins up the real relay router
# (crates/duduclaw-relay) on an ephemeral localhost port rather than a mock,
# so the two halves are proven compatible against actual code, not a
# hand-written stand-in that could itself drift from the real service.
duduclaw-relay = { workspace = true }

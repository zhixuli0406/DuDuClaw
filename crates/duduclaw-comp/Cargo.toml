[package]
name = "duduclaw-comp"
# Y3-3 (2026-08-25): normalized onto the platform release train (matches
# duduclaw-shell / duduclaw-native-gui, the other two workspace-excluded
# crates in this same category — both already track this number). Was
# "0.1.0" (a leftover from this crate's Shell-S0 spike origin) while the
# platform had long since moved to 1.62.0; `scripts/release.sh audit`
# flags exactly this kind of drift. Kept in sync going forward by that
# script's generic crates/*/Cargo.toml bump loop (same mechanism as shell/
# native-gui) — see its "cargo|pyproject" bump case.
version = "1.62.0"
edition = "2021"
publish = false
description = "Shell-S0 spike: a self-built Wayland compositor (smithay), adapted from the smithay `smallvil` example."

# Detach from the parent DuDuClaw workspace. smithay is Linux-only — it pulls
# wayland-server/wayland-client, libxkbcommon, and (transitively, via the
# winit backend) EGL/GLES bindings that don't exist on macOS. Keeping this
# crate out of the main workspace (see the root Cargo.toml `[workspace]
# exclude` entry) keeps that dependency tree from ever touching the mac
# gateway build or its Cargo.lock. Mirrors the same pattern already used by
# crates/duduclaw-native-gui (gpui) and crates/duduclaw-shell (gpui shell).
[workspace]

# Q1 (2026-08-24): the shipping gate, matching `duduclaw-shell`'s feature of
# the same name (see that crate's `src/shipping.rs`). Empty default on
# purpose — `cargo build` with no flags, which is what the appliance image is
# built from, produces a binary in which `codrive`'s stdin input simulator
# (`DUDUCLAW_CODRIVE_DEBUG_STDIN`) is unreachable. That simulator injects
# synthetic HUMAN-seat events, including the Super+Esc emergency stop and
# Super+Enter resume, so it must not be reachable on a duty machine.
#
# Dev loop / spike verification: `cargo build --features debug-affordances`.
# `cargo test` passes in both configurations.
[features]
default = []
debug-affordances = []

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"

# CD-0 codrive spike (2026-08-21, DESIGN-codrive-desktop-2026-08.md §5):
# the agent injection channel speaks JSON-lines over a private Unix socket
# (not a Wayland protocol — see BUILD.md's "CD-0 codrive spike" section for
# why). serde/serde_json are the standard, pure-Rust, cross-platform choice
# for that; no Linux-only dependency risk beyond what smithay already pulls.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CD-2 (2026-08-21, DESIGN-codrive-desktop-2026-08.md §9 CD-1 carry-forward
# "socket rotation"): SIGHUP-triggered token rotation needs `pthread_sigmask`
# + `sigwait` (the standard "block on every thread, dequeue synchronously on
# one dedicated thread" pattern — see `codrive/mod.rs`'s
# `block_sighup_on_current_thread`/`spawn_sighup_rotation_thread` doc
# comments for why a real `signal()`/`sigaction()` handler is NOT used
# instead). `libc` is already resolved transitively (smithay's dependency
# tree pulls it in) — this just promotes it to a direct dependency for
# these bindings, same "no new crate, no portability concern (already
# Linux-only)" reasoning `generate_token_bytes`'s `/dev/urandom` read used
# in the CD-1 round.
libc = "0.2"

# CUR-1 (2026-08-22): standard XCursor theme loading for the HUMAN pointer
# (`src/cursor/`). smithay 0.7.0 ships no cursor-theme loader of its own —
# anvil carries its own `xcursor`-based one — so this is the same crate the
# reference compositor uses. It is ALREADY in this crate's `Cargo.lock`
# (0.3.11, pulled transitively by `wayland-cursor` via smithay's winit
# backend); this entry only promotes it to a direct dependency, exactly the
# "no new crate, no new portability concern" reasoning the `libc` entry above
# used. Pure Rust, no system dependency of its own — it reads
# `/usr/share/icons/<theme>/cursors/<name>` files and parses them.
xcursor = "0.3"

# WM-2 (2026-08-23): glyph rasterisation for the server-side title bar
# (`src/decor/text.rs`). Pure Rust, zero system dependencies, no font-config
# / HarfBuzz / FreeType — it parses a TTF and hands back antialiased coverage
# for one glyph at a time, which is exactly (and only) what a title bar with
# no bidi, no ligatures and no complex-script shaping needs. The two fonts it
# rasterises are vendored under `assets/fonts/` and `include_bytes!`-embedded,
# so a title bar renders identically on the appliance image and in a bare
# build container (no `/usr/share/fonts` dependency — the same reasoning
# `cursor/fallback.rs` used for the built-in arrow).
ab_glyph = "0.2"

# Version pin rationale (2026-08-19, Shell-S0 spike):
# smithay's latest crates.io release is 0.7.0 (published 2025-06-24,
# rust-version = "1.80.1"). We deliberately pin to the published release
# rather than git-pinning master: the `smallvil` example on `master` has
# already moved to edition 2024 and diverged from 0.7.0's API in ways not
# needed for this spike (winit backend + xdg-shell + single output). A git
# pin is the documented fallback if a future run of this crate needs an API
# only present post-0.7.0 — none was needed to get `cargo build` green.
# A4-1 (2026-08-22) added the real-hardware backend feature set on top of
# the original winit-only list. Both backends are compiled into the one
# binary and chosen at RUNTIME (`src/backend_choice.rs`), never by a cargo
# feature — a compile-time split would mean shipping two binaries and would
# make `BUILD.md`'s nested container verification stop covering the code
# that actually runs on the appliance.
#
# Feature names are smithay 0.7.0's own (verified against the published
# crate's `[features]` table, not from memory):
#   backend_drm             -> DrmDevice/DrmSurface/vblank event source
#   backend_gbm             -> GbmDevice/GbmAllocator (pulls backend_drm)
#   backend_egl             -> EGLDisplay/EGLContext (already implied by
#                              backend_winit, listed explicitly for clarity)
#   backend_libinput        -> LibinputInputBackend + the `input` reexport
#   backend_udev            -> UdevBackend/primary_gpu/all_gpus
#   backend_session_libseat -> LibSeatSession (seatd/logind via libseat)
#   renderer_gl             -> GlesRenderer (already implied by backend_winit)
#
# System build dependencies this adds beyond the original
# pkg-config/libwayland-dev/libxkbcommon-dev trio: libinput-dev, libudev-dev,
# libseat-dev, libgbm-dev, libdrm-dev. See BUILD.md.
[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
]

[[bin]]
name = "duduclaw-comp"
path = "src/main.rs"

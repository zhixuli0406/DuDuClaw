[package]
name = "duduclaw-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
cron = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
fs2 = "0.4"
# relay_protocol.rs (WP-E2): base64-encodes/decodes HookFrame.body_b64 — the
# wire type shared verbatim with duduclaw-relay, which already depends on
# this exact version.
base64 = { workspace = true }

# WP21 debt ⑧ — MCP caller-identity token (src/identity_token.rs).
# Pure-Rust RustCrypto stack: no build script, no C toolchain, and `Mac::verify_slice`
# gives the constant-time tag comparison for free. `getrandom` is the OS CSPRNG used
# once, to mint `~/.duduclaw/identity.key`.
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
# llm_contract (LLM output contract primitives): RFC 3986 encoding of canonical
# coverage refs and NFC normalization before encoding. Both already in Cargo.lock.
percent-encoding = "2.3.2"
unicode-normalization = "0.1.25"

[features]
default = []
# `compat.d` declarative app-compatibility runner registry (src/compat_runners.rs).
# OS-only: only DuDuClaw OS ships the `compat.d` layer and the shell that spawns
# its runners, so the platform binary does not compile it. The OS recipe turns it
# on through `duduclaw-cli`'s own `app-compat` feature.
app-compat = []
# Optional OS keychain storage for the master secret (see src/keychain.rs).
# NOT in default features — keeps the default build free of native credential
# store dependencies. Enable per-platform with `--features keychain`.
keychain = ["dep:keyring"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `keyring` platform backends are selected per-target so enabling the `keychain`
# feature compiles only the backend that matches the build host.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, features = ["sync-secret-service"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3"

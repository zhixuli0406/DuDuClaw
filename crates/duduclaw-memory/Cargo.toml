[package]
name = "duduclaw-memory"
version.workspace = true
edition.workspace = true

[features]
# Pause / fault points on the publish and forget-apply paths, for other
# crates' race tests (enable through a dev-dependency). Off in production.
test-hooks = []

[dependencies]
duduclaw-core = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10"
csv = "1"
toml = { workspace = true }
fs2 = "0.4"
tree-sitter = "0.26.10"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
ignore = "0.4.27"

[dev-dependencies]
tempfile = "3"
# Integration tests (`tests/`) build the library without `cfg(test)`; they get
# `Provenance::test_only` through the feature.
duduclaw-memory = { path = ".", features = ["test-hooks"] }

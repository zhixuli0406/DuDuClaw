[package]
name = "duduclaw-auth"
version.workspace = true
edition.workspace = true

[dependencies]
duduclaw-core = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }

hmac = "0.12"
sha1 = "0.10"
subtle = "2"
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation", "danger-credential-internals"] }

# Password hashing
argon2 = { version = "0.5", features = ["std"] }
password-hash = "0.5"

# JWT
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }

# webauthn-rs pulls in OpenSSL; Windows runners lack system OpenSSL, and vendoring needs Perl provided by GitHub Windows runners.
[target.'cfg(windows)'.dependencies]
openssl = { version = "=0.10.81", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

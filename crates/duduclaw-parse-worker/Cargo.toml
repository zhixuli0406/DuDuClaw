[package]
name = "duduclaw-parse-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
engine = ["dep:zip", "dep:quick-xml", "dep:calamine", "dep:pdf-extract", "dep:image", "dep:encoding_rs", "dep:scraper", "dep:ego-tree", "dep:csv", "dep:chrono", "dep:url", "dep:serde_yaml"]

[[bin]]
name = "duduclaw-parse-worker"
path = "src/main.rs"
required-features = ["engine"]

[dependencies]
duduclaw-isolation.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
url = { version = "2", optional = true }
serde_yaml = { version = "0.9", optional = true }
sha2 = "0.10"
uuid.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "=0.41.0", optional = true }
calamine = { version = "=0.38.0", default-features = false, features = ["dates"], optional = true }
pdf-extract = { version = "=0.12.1", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"], optional = true }
encoding_rs = { version = "0.8", optional = true }
scraper = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = true }
csv = { version = "1", optional = true }
ego-tree = { version = "0.10", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", features = ["socket", "uio", "fs", "user", "resource", "poll", "time", "signal"] }
libc = "0.2"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

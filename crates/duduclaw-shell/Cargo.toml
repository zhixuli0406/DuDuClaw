[package]
name = "duduclaw-shell"
version = "1.62.0"
edition = "2021"
publish = false

# Detach from the parent DuDuClaw workspace — same reasoning as
# `duduclaw-native-gui`'s own Cargo.toml (see that file's comment): gpui
# pulls the entire zed-industries/zed monorepo plus wgpu/metal/font-kit and
# hundreds of transitive crates, and this crate additionally depends on
# duduclaw-native-gui by PATH (not by registry). The root `Cargo.toml`
# `[workspace] exclude` list already accounts for this crate
# (`crates/duduclaw-shell` — added there by the parent task, not touched
# from here).
[workspace]

# Q1 (2026-08-24): the shipping gate. See `src/shipping.rs`'s header comment
# for the `/etc/duduclaw/kiosk.env` hole this closes and for the full list of
# what it covers.
#
# DELIBERATELY EMPTY DEFAULT. `cargo build` with no flags — which is what the
# appliance image is built from — produces a binary in which
# `DUDUCLAW_SHELL_DIAG`, `_DEBUG_SURFACE`, `_DEBUG_OOBE_STEP`,
# `_DEBUG_SETTINGS_PAGE`, `_FORCE_OOBE`, `_SKIP_OOBE`, `_OOBE_LOCAL_ACCOUNT`,
# `_FAKE_NET`, `_FAKE_AUDIO` and `_LOCK_NO_PASSWORD` are not read at all.
# Forgetting the flag is therefore SAFE; an on-by-default feature would have
# the opposite failure direction.
#
# Dev loop / VM diagnosis:
#   cargo build --features debug-affordances
#   cargo test  --features debug-affordances
# `cargo test` must pass in BOTH configurations — see `src/shipping.rs`.
[features]
default = []
debug-affordances = []

[dependencies]
# Pinned to the exact rev `duduclaw-native-gui/Cargo.toml` pins — required
# to match: two different revs resolve to two distinct, incompatible `gpui`
# package instances (D4 spike finding, see
# `duduclaw-native-gui/src/mds_gpui/mod.rs`'s header comment), which would
# make `duduclaw_native_gui::mds_gpui`'s `Div`/`Context`/etc. types
# incompatible with this crate's own gpui types — the whole point of
# depending on that crate's `theme`/`mds_gpui` facade would be defeated.
gpui = { git = "https://github.com/zed-industries/zed", rev = "7a7c3e1d2f03195c5fa19bc890da330ad7f3abef", features = ["profiler"] }
# Shell-S2 (2026-08-20): `wayland` added to this list for Linux buildability
# (DuDuClaw OS's actual target platform — macOS is the dev-loop host, not
# the ship target). Verified at this pinned rev (vendored checkout
# `crates/gpui_platform/Cargo.toml`): `gpui_platform`'s OWN feature default
# is `[]`, and its Linux-only dependency `gpui_linux` is declared at the zed
# workspace root with `default-features = false` — so without this,
# `gpui_linux` compiles on Linux with NO windowing backend at all (its
# `wayland`/`x11` features, which `gpui_linux`'s own crate-level `default =
# ["wayland", "x11"]` would normally turn on, never reach it, because
# `default-features = false` at the workspace-dependency level overrides
# that). `gpui_platform`'s `wayland = ["gpui_linux/wayland"]` feature is the
# only path that re-enables it. `x11` was deliberately left off: this crate
# targets Wayland-only environments (weston headless for this round's
# verification, real compositors for the appliance image later) and adding
# an unused backend would just be extra build surface. Safe to add
# unconditionally (not `[target.'cfg(...)'.dependencies]`-gated) because
# `gpui_platform`'s own `[target.'cfg(any(target_os = "linux", target_os =
# "freebsd"))'.dependencies] gpui_linux.workspace = true` entry already
# means `gpui_linux` (and therefore this feature) is a no-op on macOS/
# Windows — cargo's feature unification just never activates code that
# isn't in the dependency graph for the host target. Confirmed inert on
# macOS: `cargo test` here stays green after this change (see
# `BUILD-LINUX.md`'s "macOS regression check" section).
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7a7c3e1d2f03195c5fa19bc890da330ad7f3abef", features = ["font-kit", "wayland"] }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "7a7c3e1d2f03195c5fa19bc890da330ad7f3abef" }

# MDS theme tokens + hand-rolled component facade (`theme.rs` / `mds_gpui/`)
# — see `duduclaw-native-gui/src/lib.rs` for exactly what's exposed. Path
# dependency: both crates are internal, unpublished (`publish = false`),
# and live in the same repo.
duduclaw-native-gui = { path = "../duduclaw-native-gui" }

# Shell-S1: OOBE state persistence (`src/oobe/mod.rs`'s `oobe_state.json`).
# Plain `serde`/`serde_json`, not `duduclaw-core` — same "hand-duplicate the
# tiny bit of shared logic, don't pull in the gateway's dependency tree"
# reasoning `duduclaw-native-gui/src/config.rs`'s own `config_path()` doc
# comment gives (this crate is detached from the root workspace precisely
# to keep gpui's build isolated). serde/serde_json are already common
# transitive deps of gpui's own tree, so this adds negligible build cost.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shell-S3 (2026-08-21): real Wi-Fi backend (`oobe/network/nm.rs`) talks to
# NetworkManager over D-Bus. `[target.'cfg(...)'.dependencies]`, same
# per-platform gating shape `gpui_linux` already gets via `gpui_platform`'s
# `wayland` feature above — Linux is DuDuClaw OS's actual ship target
# (`BUILD-LINUX.md` calls it that explicitly), macOS is this crate's
# dev-loop host only and has no D-Bus/NetworkManager to talk to, so
# `zbus`'s entire dependency tree (async-io, futures-util, nix, …) never
# enters this crate's macOS build graph at all — confirmed the same way the
# `wayland` feature's inertness was confirmed (`BUILD-LINUX.md`'s "macOS
# regression check": `cargo test` here stays green with zero new deps
# actually compiled). Default features (`async-io` + `blocking-api`) are
# exactly what's needed: `blocking-api` is what exposes `zbus::blocking::
# {Connection,Proxy}` (the API `nm.rs` uses — see that module's own header
# comment for why the generic `Proxy`, not the `#[zbus::proxy]` macro), and
# `async-io` is `blocking-api`'s own required runtime underneath — a small,
# self-contained executor, NOT `tokio` (at the time this comment was
# written — Shell-S4 below is the first thing in this crate that actually
# needs tokio, for an unrelated reason; zbus's own async-io stays fully
# independent of it).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dependencies.tokio]
# Shell-S4 (2026-08-22): `gateway_client::ws_rpc` needs a WebSocket client
# for `approvals.list`/`approvals.decide` — the gateway's dashboard RPC
# surface exists ONLY on `/ws` (grepped `duduclaw-gateway/src/server.rs`'s
# route table before writing this: no REST equivalent for either method),
# so unlike `oobe/claim.rs`'s HTTP calls, hand-rolling this one is not the
# right tradeoff — RFC 6455 framing (masking, the Sec-WebSocket-Accept
# handshake, fragmented frames) is real surface to get subtly wrong, not a
# few dozen lines like `claim.rs`'s HTTP/1.1 GET/POST.
#
# `tokio`/`tokio-tungstenite`/`futures-util` below are NOT new compiled
# dependencies, despite being declared here for the first time: this crate
# already depends on `duduclaw-native-gui` by path (see above), and THAT
# crate's own `ws_status.rs` already pulls in all three at these exact
# versions for its persistent authenticated `/ws` session. Verified with
# `cargo tree -p duduclaw-shell -i tokio-tungstenite` (and `-i tokio`, `-i
# futures-util`) before adding this block: every existing edge into the
# graph was already `duduclaw-native-gui -> duduclaw-shell`. Declaring them
# here only promotes an already-compiled transitive dependency to a direct
# one so `gateway_client` can use it — zero new crates enter the build.
# Feature list mirrors `duduclaw-native-gui/Cargo.toml`'s own `tokio`
# declaration for the same reason stated there: Cargo unifies features
# across the whole resolved graph, so this crate requesting a narrower set
# would not shrink what's actually compiled either way.
version = "1"
features = ["rt-multi-thread", "net", "time", "macros", "sync"]

[dependencies.tokio-tungstenite]
version = "0.24"

[dependencies.futures-util]
# `.split()` on the WS stream (`SinkExt`/`StreamExt`) — same as
# `duduclaw-native-gui/src/ws_status.rs`'s own usage; already in this
# crate's resolved graph as a DIRECT dependency of `gpui` itself (see this
# block's own header comment), so this is doubly free.
version = "0.3"

# Shell-S4-lock (2026-08-22): the lockscreen surface's live clock
# (`lockscreen/render.rs::now_local_strings`) needs local-time formatting —
# `chrono::Local::now()`. Same "already-compiled transitive dep, promoted to
# direct, zero new crates" situation as the `tokio`/`tokio-tungstenite` block
# above: verified with `cargo tree -p duduclaw-shell -i chrono` before adding
# this — `chrono` is ALREADY in this crate's resolved graph twice over, via
# `duduclaw-native-gui` (its own `Cargo.toml` declares the identical
# `["clock","std"]` feature set, for its own `chrono::Local`/`chrono::Utc`
# usage across `screens/*.rs`) AND via `gpui` itself. Feature set mirrors
# `duduclaw-native-gui/Cargo.toml`'s own declaration exactly, same reasoning
# that file gives (Cargo unifies features across the whole resolved graph
# regardless, so requesting a narrower set here would not shrink the actual
# build either way).
[dependencies.chrono]
version = "0.4"
default-features = false
features = ["clock", "std"]

[package]
name = "duduclaw-run"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
duduclaw-isolation.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
landlock = "0.4.5"

[lints]
workspace = true

[features]
root-test-fixture = []

# R7a: the shipped isolation self-test, built with the trampoline (release
# included). Not a mode of `duduclaw-run`; it accepts no argument at all.
[[bin]]
name = "duduclaw-run-selftest"
path = "src/bin/selftest.rs"

[[bin]]
name = "duduclaw-run-root-fixture"
path = "src/bin/root-fixture.rs"
required-features = ["root-test-fixture"]

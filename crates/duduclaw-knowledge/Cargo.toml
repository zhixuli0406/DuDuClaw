[package]
name = "duduclaw-knowledge"
version.workspace = true
edition.workspace = true
license.workspace = true

# Document knowledge base (collections of uploaded files with collection-level
# permissions). Storage, extraction, chunking, keyword retrieval and the ACL
# live here; the gateway owns writes, the background worker and the routes.
#
# Document parsers are pinned exactly (`=`): every one of them reads files a
# customer uploads, so the version that was reviewed is the version that
# ships. They only ever run inside the `duduclaw knowledge-extract` child
# process, never in the gateway.

[lints]
workspace = true

[dependencies]
duduclaw-core = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1.25"
# Office containers: deflate only, same as the rest of the workspace.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
quick-xml = "=0.41.0"
calamine = { version = "=0.36.1", default-features = false, features = ["dates"] }
csv = "1"
encoding_rs = "0.8"
scraper = "0.22"
# scraper's own tree type (already in the lockfile through scraper).
ego-tree = "0.10"
# PDF text layer (MIT). Pulls lopdf (MIT) with default features off.
pdf-extract = "=0.12.1"

# Vector retrieval (local embedding models). ONNX Runtime is loaded at
# runtime from `<home>/lib/onnxruntime/<ver>/` through the shared
# `duduclaw-onnx` init (one per process, shared with redaction NER); the
# `ort` features must stay identical to duduclaw-redaction's.
duduclaw-onnx = { workspace = true, features = ["install", "runtime"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "tracing", "api-24"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
# Model download (async, through duduclaw-onnx) and the cloud embedding
# providers (blocking client; only ever called off the async runtime).
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
# Offline bundles: minisign signature (release key) checked before the tar
# is read; both already in the workspace lock.
minisign-verify = "0.2"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util", "macros"] }
minisign = { version = "0.7", default-features = false }

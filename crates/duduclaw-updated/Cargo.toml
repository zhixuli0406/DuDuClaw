[package]
name = "duduclaw-updated"
version.workspace = true
edition.workspace = true
license.workspace = true

# Root bootstrap verifier (plan R1). A test-key build sets `--cfg duduclaw_test_root`
# and prints `TEST <pin>`; a production build prints `PRODUCTION <pin>`.
[[bin]]
name = "duduclaw-bootstrap"
path = "src/bin/duduclaw-bootstrap.rs"

[dependencies]
duduclaw-isolation.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
sha2 = "0.10"
ed25519-dalek = "2.2"
hex = "0.4"
# Legacy release signature of the migration bundle (same crate as duduclaw-gateway).
minisign-verify = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["socket", "uio", "user", "fs"] }

[dev-dependencies]
tempfile = "3"
# Test-only minisign signer (prehashed BLAKE2b-512); already in Cargo.lock.
blake2 = "0.10"

[lints]
workspace = true

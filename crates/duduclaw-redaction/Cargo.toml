[package]
name = "duduclaw-redaction"
version.workspace = true
edition.workspace = true

# RFC-23 — Sensitive Data Redaction Pipeline.
#
# Source-aware redaction of internal/PII data before it reaches the online LLM,
# with reversible restoration at trusted boundaries (user channel, whitelisted
# tool egress). All token ↔ original mappings are persisted in an encrypted
# SQLite vault (AES-256-GCM, per-agent key, TTL 7d default, fail-closed).

[dependencies]
# Internal
duduclaw-core = { workspace = true }
duduclaw-security = { workspace = true }
duduclaw-identity = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Persistence
rusqlite = { workspace = true }

# Crypto (HMAC + key generation; AES-256-GCM is reused from duduclaw-security)
ring = { workspace = true }
base64 = { workspace = true }

# Time
chrono = { workspace = true }

# Rule matching
regex = "1"
# HIR walk behind `custom_rules::synthesize_example` (regex → one
# representative value for the dashboard's rule list). Already in the tree as
# `regex`'s own dependency, so this adds no new compile unit.
regex-syntax = "0.8"

# UUID — for vault entry uniqueness
uuid = { workspace = true }

# ---------------------------------------------------------------------------
# `ner` feature (default ON) — "AI 智慧偵測": OpenAI Privacy Filter (Apache-2.0)
# run natively through ONNX Runtime. See
# `commercial/docs/DESIGN-redaction-ner-and-custom-rules-2026-09.md` §13.4.
#
# `load-dynamic` means the release binary does NOT link ONNX Runtime: the
# shared library is downloaded by `redaction.model.install` and loaded at
# runtime from `~/.duduclaw/lib/onnxruntime/<ver>/`. Keeps the default build
# free of the ORT toolchain and keeps cross-compilation honest.
# ---------------------------------------------------------------------------
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["load-dynamic", "ndarray", "tracing", "api-24"] }
# Pure-Rust regex backend (no `onig` C dependency) so the tokenizer
# cross-compiles to the mingw target like the rest of the workspace.
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["fancy-regex"] }

# Model + ONNX Runtime download (streamed, `Range`-resumable) and archive
# extraction. All four already exist in the workspace lock.
reqwest = { version = "0.12", optional = true, features = ["json", "stream"] }
futures-util = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }

[features]
default = ["ner"]
# Native NER detection (OpenAI Privacy Filter via ONNX Runtime).
# Turning it off keeps `type = "ner"` parsing (so profiles stay wire-compatible)
# but makes such a rule fail to COMPILE — fail-closed, never a silent skip.
ner = [
    "dep:ort",
    "dep:tokenizers",
    "dep:reqwest",
    "dep:futures-util",
    "dep:sha2",
    "dep:tar",
    "dep:flate2",
    "dep:zip",
]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util", "macros"] }

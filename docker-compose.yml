services:
  duduclaw:
    # Bubblewrap needs namespaces and mounts; keep capabilities dropped.
    security_opt:
      - seccomp=./container/seccomp-bwrap.json
      - apparmor=${DUDUCLAW_APPARMOR_PROFILE:-unconfined}
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: container/Dockerfile.server
    container_name: duduclaw-server
    restart: unless-stopped
    ports:
      - "18789:18789"
    volumes:
      - duduclaw-data:/home/duduclaw/.duduclaw
      - duduclaw-claude:/home/duduclaw/.claude
      - duduclaw-codex:/home/duduclaw/.codex
      - duduclaw-grok:/home/duduclaw/.grok
      - duduclaw-kimi:/home/duduclaw/.kimi-code
      - duduclaw-copilot:/home/duduclaw/.copilot
      - duduclaw-kiro:/home/duduclaw/.kiro
      - duduclaw-cursor:/home/duduclaw/.cursor
      - duduclaw-opencode:/home/duduclaw/.local/share/opencode
    environment:
      # Claude: API key, or an OAuth token from `claude setup-token`. The OAuth token is a
      # subscription credential; Anthropic's policy does not permit third-party products to
      # store or route requests through it and may enforce this without notice:
      # https://code.claude.com/docs/en/legal-and-compliance
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Codex (OpenAI): API key fallback — ChatGPT Plus/Pro OAuth lives in duduclaw-codex volume
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Gemini API provider (generateContent).
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Grok (xAI): API key — deployment-key/OIDC login lives in duduclaw-grok volume
      - XAI_API_KEY=${XAI_API_KEY:-}
      - DUDUCLAW_BIND=0.0.0.0
      - DUDUCLAW_INITIAL_PORT=18789
      - LINE_CHANNEL_TOKEN=${LINE_CHANNEL_TOKEN:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
    depends_on:
      watchtower:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/healthz"]  # /healthz 含排程器活性（停擺→503）；/health 永遠回 ok
      interval: 30s
      timeout: 10s
      retries: 3

  watchtower:
    image: containrrr/watchtower:1.7.1  # Pin to specific version
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_SCOPE=duduclaw
    labels:
      - "com.centurylinklabs.watchtower.scope=duduclaw"

  tailscale:
    # TODO: Pin to digest for production deployments
    # Example: image: tailscale/tailscale:v1.78.3@sha256:abc123...
    image: tailscale/tailscale:latest
    hostname: duduclaw
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
    profiles:
      - tailscale

volumes:
  duduclaw-data:
  duduclaw-claude:
  duduclaw-codex:
  duduclaw-grok:
  duduclaw-kimi:
  duduclaw-copilot:
  duduclaw-kiro:
  duduclaw-cursor:
  duduclaw-opencode:
  tailscale-state:

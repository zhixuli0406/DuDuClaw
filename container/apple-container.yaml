# Apple Container configuration for DuDuClaw Agent
# Requires macOS 26+ with container CLI

name: duduclaw-agent
# The platform's published image for your DuDuClaw version (the tag carries
# the `v` prefix, e.g. ghcr.io/zhixuli0406/duduclaw:v1.67.0). It is the same
# image `config.toml [container.sandbox] image` defaults to; it is never
# pulled automatically. Note: DuDuClaw's built-in Apple Container backend
# currently refuses to create sandbox containers (no network/tmpfs/memory
# isolation yet) — this file is a manual sample only.
image: ghcr.io/zhixuli0406/duduclaw:v<version>

resources:
  cpus: 2
  memory: 2G

network:
  mode: bridge

mounts:
  - source: ~/.duduclaw
    target: /home/duduclaw/.duduclaw
    readonly: true
  - source: ~/projects
    target: /projects
    readonly: false

environment:
  AGENT_NAME: dudu
  CLAUDE_MODEL: claude-sonnet-4-6

user: 1000:1000

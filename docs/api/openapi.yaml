          application/json:
            schema:
              $ref: "#/components/schemas/EmptyParams"
      responses:
        "200":
          description: Aggregate statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_memories:
                    type: integer
                  total_evolutions:
                    type: integer
                  agents:
                    type: object
                    additionalProperties:
                      type: object

  /rpc/system.doctor:
    post:
      tags: [system]
      summary: Run health checks
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyParams"
      responses:
        "200":
          description: Health check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        status:
                          type: string
                          enum: [pass, warn, fail]
                        message:
                          type: string
                  summary:
                    type: object
                    properties:
                      pass:
                        type: integer
                      warn:
                        type: integer
                      fail:
                        type: integer

  /rpc/system.doctor_repair:
    post:
      tags: [system]
      summary: Health checks with repair hints
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyParams"
      responses:
        "200":
          description: Health checks with repair suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  checks:
                    type: array
                    items:
                      type: object
                  summary:
                    type: object
                  repair_hints:
                    type: array
                    items:
                      type: string

  /rpc/system.config:
    post:
      tags: [system]
      summary: View system configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyParams"
      responses:
        "200":
          description: Current system config
          content:
            application/json:
              schema:
                type: object
                description: Full config.toml as JSON

  /rpc/system.update_config:
    post:
      tags: [system]
      summary: Update config.toml keys (admin)
      description: >
        Partial update: only keys present are written. Parameters are named
        after their TOML path and may be sent nested
        (`{"takeover": {"enabled": true}}`) or flat (`{"takeover.enabled": true}`).
        A wrong type or out-of-range value rejects the whole update and
        nothing is written. v1.68 keys: takeover.*, mail.*, webchat.*
        (widget_key is never echoed), tick.*, files.allowed_roots (absolute
        paths), night.llm_enabled, dispatch.{policy (adds role_team),
        judge_provider, judge_model}, acp.trusted (audited as
        config_protected_key_changed), telemetry.otlp_endpoint,
        container.sandbox.* (validated as a whole section), computer_use.image,
        memory.supersession_trust_guard, team.{enabled, gate,
        roles.<planner|executor|verifier|utility|synthesizer>.{runtime,model,effort}},
        integrations.github, redaction.purge_after_expire_days,
        secret_manager.{onepassword_*, infisical_*}. Removed: voice.asr_provider,
        voice.asr_language, voice.voice_reply_enabled.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                log_level:
                  type: string
                  enum: [trace, debug, info, warn, error]
                rotation_strategy:
                  type: string
                  enum: [priority, round_robin, least_cost, failover]
                log_format:
                  type: string
                  enum: [pretty, json]
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  changes:
                    type: array
                    items:
                      type: string
                  applied:
                    type: boolean
                  hot_reloaded:
                    type: array
                    items:
                      type: string
                  restart_required:
                    type: array
                    description: TOML keys (or a whole section such as `tick`) that take effect only after a gateway restart.
                    items:
                      type: string

  /rpc/config.raw.get:
    post:
      tags: [system]
      summary: Read a config file as TOML text with secrets masked (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  description: "`config`, `inference` or `agent:<id>`"
      responses:
        "200":
          description: Masked file
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { type: string }
                  exists: { type: boolean }
                  content: { type: string, description: "Secret values replaced by «set»; [mcp_keys] omitted" }
                  masked: { type: array, items: { type: string } }
                  hidden_sections: { type: array, items: { type: string } }
                  hash: { type: string, description: "Send back as base_hash" }

  /rpc/config.raw.set:
    post:
      tags: [system]
      summary: Validate and write a config file (admin; backup + audit)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [file, content]
              properties:
                file: { type: string }
                content: { type: string, description: "«set» keeps the stored value" }
                base_hash: { type: string }
                accept_subscription_risk:
                  type: boolean
                  description: Since v1.74.0, required `true` when `file` is `config` and the new content adds an `[[accounts]]` entry with `type = "oauth"` that the stored file does not have (new id, or an existing id switched to oauth). Without it the call is refused with error code `subscription_risk_not_accepted` and nothing is written; each accepted new account writes a `subscription_risk_accepted` audit row.
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  changed_sections: { type: array, items: { type: string } }
                  protected_changed: { type: boolean }
                  backup: { type: string, nullable: true }
                  hot_reloaded: { type: array, items: { type: string } }
                  restart_required: { type: array, items: { type: string } }

  /rpc/tick.sources.list:
    post:
      tags: [system]
      summary: List [[tick.sources]] with validation state (admin; header values never returned)
      requestBody:
        content:
          application/json:
            schema:

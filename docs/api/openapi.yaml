openapi: 3.1.0
info:
  title: DuDuClaw WebSocket RPC API
  version: 1.56.0
  description: |
    JSON-RPC 2.0 API over WebSocket for DuDuClaw multi-agent orchestration.

    > **Coverage note (2026-08-13)**: this spec documents the stable core of
    > the WebSocket RPC surface but lags the product — many RPC method
    > families added after 0.12.0 (templates.*, experts.*, evolution.*,
    > playbook.*, delegation.*, widgets.*, ticks.*, notify.*, …) are not yet
    > described here. The authoritative method list is the dispatch table in
    > `crates/duduclaw-gateway/src/handlers.rs`; treat this file as a guide,
    > not an exhaustive contract. A full regeneration is tracked separately.

    ## Connection

    Connect to `ws://<host>:<port>/ws` and exchange JSON-RPC 2.0 frames:

    ```json
    { "jsonrpc": "2.0", "method": "<method>", "params": { ... }, "id": "1" }
    ```

    Responses follow the standard JSON-RPC 2.0 envelope with `result` or `error`.

    ## Authentication

    1. Send `connect.challenge` to receive a challenge string.
    2. Sign the challenge with your Ed25519 private key.
    3. Send `connect` with the signed response and your client version.

    ## Live events (2026-10-29)

    The current dashboard protocol uses WsFrame envelopes:
    `{"type":"req","id":"1","method":"runs.subscribe","params":{"run_id":"dispatch:42"}}`,
    `{"type":"res","id":"1","ok":true,"payload":{...}}`, and
    `{"type":"event","event":"agent.turn_started","payload":{...},"seq":1,"boot_id":"..."}`.
    `seq` is a per-connection u64 starting at 1 after push authorization filtering.
    `boot_id` is an additive optional field on events and successful connect payloads.
    The general broadcast capacity is 1024; lag sends `events_lost` with an empty
    payload. On loss, reconnect or changed boot_id, refetch existing list RPCs.
    No replay buffer or snapshot method exists. Duplicate invalidations are allowed.

    Live names: agent.turn_started, agent.turn_finished, agent.status_changed,
    task.created, task.updated, task.needs_human, goal.round_started,
    goal.round_finished, goal.done, goal.failed, approval.created,
    approval.decided, approval.expired, budget.breaker_open, autopilot.breaker_open.
    Agent events require employee access, task/goal events require task audience,
    approval events require Manager plus the per-kind card audience
    (knowledge_add_source: Admin or a collection editor/owner; operator-CLI,
    workflow activation, agent file, support pilot and board kinds: Admin;
    knowledge quarantine and expert-skills enable: employee Viewer),
    and breakers/unknown names require Admin. run.step is never broadcast: it uses
    an explicitly subscribed connection queue and the runs.get content gates.
    Payloads are identifiers, enums and compact labels, not prompts/tool arguments.
    agent.turn_started/finished payloads contain only agent_id, source and runtime;
    they never include session_id or task_id. source is one of channel, goal, cron,
    heartbeat, responsibility, assign or autopilot.
    Bridged task/approval/status metadata is rebuilt from authoritative stores.
    Legacy cron.changed/memory.changed/skill.changed/channel_config.changed
    bridge payloads are pure invalidations: only a validated agent_id, or an
    empty object. Entity labels, subjects and content are never forwarded.
    Dashboard bridge payloads are limited to 8192 bytes before parsing, coalesced
    by event/entity, and capped at 64 authoritative projections per poll. Invalid
    or missing ids do not consume that delivery budget. A separate 256-row cap
    bounds parsing and lookups. Byte/work/delivery cap drops advance the cursor
    and send one empty events_lost per tick; tasks, agents and inbox stores refetch.
    Only inbox counts have a five-minute periodic fallback; tasks and agents do not.
    Web invalidation reads use a 2-second minimum interval
    with leading/trailing refresh and exponential error backoff up to 60 seconds.

    ## Method Categories

    | Prefix | Description |
    |--------|-------------|
    | `agents.*` | Agent lifecycle and management |
    | `channels.*` | Channel management (11 platforms) |
    | `accounts.*` | OAuth/API account rotation and budgets |
    | `memory.*` | Cognitive memory search and browsing |
    | `skills.*` | Skill ecosystem discovery |
    | `cron.*` | Scheduled task management |
    | `system.*` | System status, config, diagnostics |
    | `license.*` | License activation and status |
    | `analytics.*` | Usage analytics and cost savings |
    | `referral.*` | Referral code system |
    | `security.*` | Audit logs, credentials, browser approval |
    | `models.*` | Model listing (cloud + local) |
    | `logs.*` | Real-time log streaming |
    | `heartbeat.*` | Agent heartbeat scheduling |
    | `evolution.*` | Evolution engine status |
    | `browser.*` | Browser automation approval |
    | `billing.*` | Usage and billing history |
    | `marketplace.*` | Skill marketplace |
    | `partner.*` | Partner/reseller management |
  contact:
    name: DuDuClaw
  license:
    name: Proprietary

paths:
  /api/login:
    post:
      summary: 密碼登入（MFA 第一階段）
      description: |
        未註冊且未強制時維持 access_token、refresh_token、user。
        已註冊帳號只回 mfa_required=true、challenge_id，沒有任何 token。
        Enterprise 強制期間未註冊者只回 mfa_enrollment_required=true、enrollment_token、challenge_ref。
        Personal 忽略強制開關；設定重載失敗保留最後有效快照，Enterprise 從未取得有效快照才拒絕。MFA 畫面屬下一階段。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string, writeOnly: true}
      responses:
        '200':
          description: 一般 session、第二因素 challenge，或專用註冊憑證（三者互斥）
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [access_token, refresh_token, user]
                    properties:
                      access_token: {type: string}
                      refresh_token: {type: string}
                      user: {type: object}
                  - type: object
                    additionalProperties: false
                    required: [mfa_required, challenge_id]
                    properties:
                      mfa_required: {const: true}
                      challenge_id: {type: string}
                  - type: object
                    additionalProperties: false
                    required: [mfa_enrollment_required, enrollment_token, challenge_ref]
                    properties:
                      mfa_enrollment_required: {const: true}
                      challenge_ref: {type: string, minLength: 12, maxLength: 12}
                      enrollment_token: {type: string}
        '401': {description: 登入失敗或設定不可讀}
        '429': {description: 登入嘗試過多}
  /api/otp/verify:
    post:
      summary: 通道 OTP 第一因素驗證
      description: 成功後與密碼登入共用 MFA 關卡；已註冊帳號不會取得 session token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: {type: string}
                code: {type: string, writeOnly: true}
      responses:
        '200':
          $ref: '#/paths/~1api~1login/post/responses/200'
        '401': {description: 驗證失敗或設定不可讀}
        '429': {description: 嘗試過多}
  /api/refresh:
    post:
      summary: 更新 access token
      description: |
        Enterprise 強制 MFA 時，未註冊者的 refresh 立即拒絕。憑證 epoch 不等於目前帳號版本時亦拒絕。
        原 access token 不立即撤銷，依原期限到期（預設30分鐘）。
        已註冊帳號的既有 refresh token 維持原到期日；不追溯要求舊 session 提交第二因素。
        設定無法讀取或解析時拒絕。Personal 忽略強制開關。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string, writeOnly: true}
      responses:
        '200':
          description: 新的 access token，保持原 session 身分
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token: {type: string}
        '401': {description: refresh 無效或 epoch 不符、帳號無效、需註冊 MFA 或沒有有效設定快照}
        '429': {description: 更新嘗試過多}
  /api/mfa/verify:
    post:
      summary: 完成第二因素並取得 session
      description: Challenge 有效5分鐘、單次成功、最多5次嘗試；跨程序與重啟保留。驗證失敗會寫稽核，不記錄碼值。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id]
              properties:
                challenge_id: {type: string}
                code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
                recovery_code: {type: string, writeOnly: true}
              oneOf:
                - required: [code]
                  not: {required: [recovery_code]}
                - required: [recovery_code]
                  not: {required: [code]}
      responses:
        '200':
          description: 驗證成功
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, user]
                properties:
                  access_token: {type: string}
                  refresh_token: {type: string}
                  user: {type: object}
        '401': {description: 驗證失敗、過期、已消耗或資料不可讀}
        '429': {description: 嘗試過多}
  /api/mfa/enroll/begin:
    post:
      summary: 使用專用註冊憑證開始註冊
      description: |
        憑證只用於兩條 enroll 路由；開始不啟用 MFA。必須先提出 proof_code，
        有已驗證通道時為該次獨立 OTP，否則為另一位 Admin 或主機操作員核發的一次性註冊碼。
        通道 OTP 第一因素登入者還要提供 password，confirm 也一樣。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enrollment_token]
              properties:
                enrollment_token: {type: string, writeOnly: true}
                proof_code: {type: string, writeOnly: true, description: 獨立證明，begin 必填；驗證後綁定該次 challenge}
                password: {type: string, writeOnly: true, description: 通道 OTP 第一因素時必填}
      responses:
        '200':
          description: 將秘密鍵匯入驗證器，接著確認
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret: {type: string}
                  otpauth_uri: {type: string}
        '401': {description: 註冊憑證無效或資料不可讀}
        '429': {description: 嘗試過多}
  /api/mfa/enroll/confirm:
    post:
      summary: 確認註冊並簽發 session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enrollment_token, code]
              properties:
                enrollment_token: {type: string, writeOnly: true}
                proof_code: {type: string, writeOnly: true, description: 獨立證明，begin 必填；驗證後綁定該次 challenge}
                password: {type: string, writeOnly: true, description: 通道 OTP 第一因素時必填}
                code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
      responses:
        '200':
          description: 註冊已啟用，備援碼只回傳一次
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, user, recovery_codes]
                properties:
                  access_token: {type: string}
                  refresh_token: {type: string}
                  user: {type: object}
                  recovery_codes:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items: {type: string}
        '401': {description: 憑證或驗證碼無效、已消耗、過期或資料不可讀}
        '429': {description: 嘗試過多}
  /rpc/mfa.status:
    post:
      tags: [auth]
      summary: 本人 MFA 啟用與強制狀態
      description: 透過已認證 dashboard WebSocket 呼叫；不接受 enrollment_token 作為身分。
      responses:
        '200': {description: RPC 結果（成功或拒絕）；確認／重產的備援碼僅顯示一次}
  /rpc/mfa.enroll_begin:
    post:
      tags: [auth]
      summary: 驗證目前密碼後開始本人註冊，綁定 JWT jti 與5分鐘期限
      description: |
        強制時先回 enrollment_token、proof_required、challenge_ref；再帶 password、該 token 與 proof_code
        呼叫 begin，取得 secret、otpauth_uri、enrollment_token。未強制則首次即回密鑰。
        已啟用者須先以新的因素停用後才能重新註冊，不能直接覆寫。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, writeOnly: true}
                enrollment_token: {type: string, writeOnly: true}
                proof_code: {type: string, writeOnly: true}
      responses:
        '200': {description: RPC 結果（成功或拒絕）}
  /rpc/mfa.enroll_confirm:
    post:
      tags: [auth]
      summary: 本人以目前 TOTP 啟用，回傳10組一次性 recovery_codes
      description: 透過已認證 dashboard WebSocket 呼叫；不接受 enrollment_token 作為身分。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_token, code]
              properties:
                enrollment_token: {type: string, writeOnly: true}
                code: {type: string}
      responses:
        '200': {description: RPC 結果（成功或拒絕）；確認／重產的備援碼僅顯示一次}
  /rpc/mfa.recovery_regenerate:
    post:
      tags: [auth]
      summary: 以新的 TOTP 或未使用備援碼取代所有 recovery_codes
      description: 透過已認證 dashboard WebSocket 呼叫；不接受 enrollment_token 作為身分。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        '200': {description: RPC 結果（成功或拒絕）；確認／重產的備援碼僅顯示一次}
  /rpc/mfa.disable:
    post:
      tags: [auth]
      summary: 以目前密碼及新的 TOTP 或未使用備援碼停用；強制期間拒絕
      description: 透過已認證 dashboard WebSocket 呼叫；不接受 enrollment_token 作為身分。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password]
              properties:
                code: {type: string}
                password: {type: string, format: password, maxLength: 4096}
      responses:
        '200': {description: RPC 結果（成功或拒絕）；確認／重產的備援碼僅顯示一次}
  /rpc/mfa.overview:
    post:
      description: 透過已認證 dashboard WebSocket 呼叫，不接受 enrollment_token 作為身分。users 含 channel_bindings（verified_at 為 Unix 微秒，未知為 null）；policy 含 degraded、warning、last_good_enforced、enforced_at。只接受強制前的已驗證通道作為註冊證明；既有密碼持有人預先植入的綁定無法辨識。
      tags: [auth]
      summary: 目前有效 Admin 查看每位使用者的 user_id、email、enabled；無秘密鍵
      responses:
        '200': {description: RPC 結果（成功或拒絕）；確認／重產的備援碼僅顯示一次}
  /rpc/users.mfa_reset:
    post:
      tags: [auth]
      summary: 目前有效 Admin 以自身新 TOTP 或備援碼重設別人 MFA；拒絕自我重設
      description: 透過已認證 dashboard WebSocket 呼叫；不接受 enrollment_token 作為身分。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, code]
              properties:
                user_id: {type: string}
                code: {type: string, writeOnly: true}
      responses:
        '200': {description: RPC 結果（成功或拒絕）；確認／重產的備援碼僅顯示一次}
  /rpc/users.mfa_enrollment_code:
    post:
      tags: [auth]
      summary: 目前有效 Admin 核發別人的一次性註冊碼，禁止自行核發
      description: 綁定目標帳號及指定待完成 challenge。使用者提供 12 字元 challenge_ref，5分鐘有效、雜湊保存、只顯示一次並稽核。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, challenge_ref]
              properties:
                user_id: {type: string}
                challenge_ref: {type: string, minLength: 12, maxLength: 12}
      responses:
        '200': {description: enrollment_code 與 expires_in（秒），或 RPC 拒絕}
  /ws:
    get:
      summary: WebSocket JSON-RPC 2.0 endpoint
      description: |
        Upgrade to WebSocket for bidirectional JSON-RPC 2.0 communication.
        All methods listed below are invoked via this single endpoint.
      responses:
        "101":
          description: WebSocket upgrade successful

  # ── Connection ───────────────────────────────────────────────

  /rpc/tasks.goal_decide:
    post:
      tags: [tasks]
      summary: Decide a paused goal or continue a finished goal
      description: |
        Requires Operator access to the task's agent and private-task authorization.
        retry/done/abort/takeover apply to needs_human; continue requires a
        goal-mode task in done/failed/cancelled and a nonempty message.
        If expected_updated_at is supplied, compare the exact tasks.list_page
        updated_at string inside the same SQLite IMMEDIATE transaction as the
        decision. All five actions return goal_decide_revision_mismatch on a
        mismatch without changing the task or emitting decision side effects.
        Omitting it preserves existing dashboard behavior. Null/non-string values
        are rejected. The control room always supplies it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, action]
              properties:
                task_id:
                  type: string
                action:
                  type: string
                  enum: [retry, done, abort, takeover, continue]
                note:
                  type: string
                message:
                  type: string
                  description: Required nonempty follow-up for continue.
                expected_updated_at:
                  type: string
                  description: Exact updated_at string from the displayed task.
      responses:
        "200":
          description: RPC result with ok/message/task, or a stable revision mismatch error.

  /rpc/connect.challenge:
    post:
      tags: [connection]
      summary: Request authentication challenge
      description: Returns a UUID challenge string for Ed25519 signing.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyParams"
      responses:
        "200":
          description: Challenge issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                    format: uuid

  /rpc/connect:
    post:
      tags: [connection]
      summary: Authenticate with signed challenge
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                signature:
                  type: string
                  format: base64
                  description: Ed25519 signature of the challenge, base64-encoded
                public_key:
                  type: string
                  format: hex
                  description: Ed25519 public key, hex-encoded (64 chars)
                version:
                  type: string
                  description: Client version string
      responses:
        "200":
          description: Connection established
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  client_version:
                    type: string
                  status:
                    type: string
                    enum: [connected]

  /rpc/tools.catalog:
    post:
      tags: [connection]
      summary: List all available RPC methods
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyParams"
      responses:
        "200":
          description: Method catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string

  # ── Agents ───────────────────────────────────────────────────

  /rpc/agents.list:
    post:
      tags: [agents]
      summary: List all registered agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyParams"
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentSummary"

  /rpc/agents.status:
    post:
      tags: [agents]
      summary: Get agent status
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
      responses:
        "200":
          description: Agent status details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatus"

  /rpc/agents.create:
    post:
      tags: [agents]
      summary: Create a new agent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Agent name (lowercase alphanumeric + hyphens)
                display_name:
                  type: string
                role:
                  type: string
                  description: Agent role description
      responses:
        "200":
          description: Agent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  agent:
                    $ref: "#/components/schemas/AgentSummary"

  /rpc/agents.delegate:
    post:
      tags: [agents]
      summary: Delegate a task to an agent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, message]
              properties:
                agent_id:
                  type: string
                message:
                  type: string
                  description: Task description to delegate
      responses:
        "200":
          description: Delegation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: string
                  status:
                    type: string

  /rpc/autonomy.pause:
    post:
      tags: [agents]
      summary: Pause autonomous work for one employee or all employees
      description: >-
        Requires live Manager role plus a live Operator binding for agent_id
        (Admin bypasses binding), or Admin for all. Exactly one scope is required.
        Does not change employee lifecycle status or block direct human chat.
        Persists across restart and emits visibility-filtered autonomy.changed.
        Not exposed to AI employees through MCP. A running goal turn finishes
        before parking at needs_human with operator_paused. Audit intent must persist
        before mutation; an unavailable audit log refuses the change without
        changing state. Optional audit_error means state was applied but its
        completion audit or acknowledgement failed; clients must not assume the write failed.
        The same atomic state write stores a validated receipt (change_id, pause/resume
        method, typed scope, actor, canonical-request SHA-256, applied_at and
        completion_recorded=false). Startup derives reconciliation only from this
        state file, never from audit rows. It appends a reconciled completion,
        pushes current state, then marks completion under the writer lock.
        The 4096-receipt cap prunes only the oldest completed entry; all-pending
        capacity refuses new mutations. Failed completion is logged for retry on
        startup. A crash between completion output and acknowledgement can repeat
        a completion with the same change_id; broadcast delivery is best-effort.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [agent_id]
                  additionalProperties: false
                  properties:
                    agent_id: {type: string}
                    reason: {type: string, maxLength: 1000, description: Longer inputs are truncated by Unicode character count.}
                - type: object
                  required: [all]
                  additionalProperties: false
                  properties:
                    all: {type: boolean, enum: [true]}
                    reason: {type: string, maxLength: 1000}
      responses:
        "200":
          description: Selected scope saved; result contains agent_id, all, paused, and pause (reason, who, at), applied=true, optional durability_warning=applied_durability_unknown after rename, and audit_error if completion audit or acknowledgement failed. Lock wait timeout returns admission_wait_timeout without applying. autonomy.changed carries only agent_id, all, paused, at.
        "403":
          description: Live role or agent binding insufficient.

  /rpc/autonomy.resume:
    post:
      tags: [agents]
      summary: Remove the selected autonomy pause
      description: >-
        Same authorization as autonomy.pause. Individual resume does not remove
        global pause; global resume does not clear individual entries. Employee
        lifecycle status and needs_human goal tasks are unchanged. Corrupt state
        is refused, never overwritten. Emits autonomy.changed. Audit intent must
        persist before mutation. Optional audit_error means the state was
        applied but its completion audit or acknowledgement failed. State-owned receipt
        reconciliation and capacity rules are the same as autonomy.pause.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [agent_id]
                  additionalProperties: false
                  properties:
                    agent_id: {type: string}
                - type: object
                  required: [all]
                  additionalProperties: false
                  properties:
                    all: {type: boolean, enum: [true]}
      responses:
        "200":
          description: Selected scope removed; result contains agent_id, all, paused=false, pause=null, applied=true, optional durability_warning=applied_durability_unknown after rename, and audit_error if completion audit or acknowledgement failed. Lock wait timeout returns admission_wait_timeout without applying. autonomy.changed carries only agent_id, all, paused, at.
        "403":
          description: Live role or agent binding insufficient.

  /rpc/autonomy.status:
    post:
      tags: [agents]
      summary: Read global and visible employee autonomy pauses
      description: >-
        Any authenticated user. Employee entries are filtered using current
        Viewer bindings; Admin sees all. Non-null state_error means ALL autonomous
        work is denied, even if global and agents appear empty. Missing state
        after initialization, invalid JSON and unsupported versions fail closed.
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: Current persistent pause state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  global:
                    type: object
                    nullable: true
                    properties:
                      reason: {type: string}
                      who: {type: string}
                      at: {type: string, format: date-time}
                  agents:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        reason: {type: string}
                        who: {type: string}
                        at: {type: string, format: date-time}
                  state_error: {type: string, nullable: true}


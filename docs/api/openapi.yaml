                  period:
                    type: string
                  total_tokens:
                    type: integer
                  total_cost_cents:
                    type: integer
                  breakdown:
                    type: array
                    items:
                      type: object

  /rpc/billing.history:
    post:
      tags: [billing]
      summary: Billing history
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                months:
                  type: integer
                  default: 6
      responses:
        "200":
          description: Historical billing data
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        month:
                          type: string
                        total_cost_cents:
                          type: integer
                        total_tokens:
                          type: integer

  # ── Marketplace ──────────────────────────────────────────────

  /rpc/marketplace.list:
    post:
      tags: [marketplace]
      summary: List available marketplace skills/plugins
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                query:
                  type: string
      responses:
        "200":
          description: Marketplace listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        category:
                          type: string
                        version:
                          type: string

  /rpc/marketplace.install:
    post:
      tags: [marketplace]
      summary: Install a marketplace skill/plugin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [item_id]
              properties:
                item_id:
                  type: string
                agent_id:
                  type: string
                  description: Target agent for installation
      responses:
        "200":
          description: Installation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Partner ──────────────────────────────────────────────────

  /rpc/partner.status:
    post:
      tags: [partner]
      summary: Partner/reseller account status
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyParams"
      responses:
        "200":
          description: Partner status
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_partner:
                    type: boolean
                  tier:
                    type: string
                  commission_rate:
                    type: number
                  customers_count:
                    type: integer

  /rpc/partner.customers:
    post:
      tags: [partner]
      summary: List partner customers
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  default: 50
                offset:
                  type: integer
                  default: 0
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        tier:
                          type: string
                        created_at:
                          type: string
                          format: date-time

  /rpc/partner.generate_license:
    post:
      tags: [partner]
      summary: Generate a license key for a customer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [customer_name, tier]
              properties:
                customer_name:
                  type: string
                tier:
                  type: string
                  enum: [pro, enterprise]
                duration_months:
                  type: integer
                  default: 12
                machine_fingerprint:
                  type: string
      responses:
        "200":
          description: License generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  license_key:
                    type: string
                    description: Base64-encoded license key

  /rpc/partner.sales:
    post:
      tags: [partner]
      summary: Partner sales summary
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                period:
                  type: string
                  enum: [month, quarter, year]
                  default: month
      responses:
        "200":
          description: Sales summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: string
                  total_sales:
                    type: integer
                  total_revenue_cents:
                    type: integer
                  commission_cents:
                    type: integer

components:
  schemas:
    EmptyParams:
      type: object
      description: No parameters required

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean

    AgentSummary:
      type: object
      properties:
        name:
          type: string
        display_name:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [active, paused, error]

    AgentStatus:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        display_name:
          type: string
        role:
          type: string
        model:
          type: string
        channels:
          type: array
          items:
            type: string

    Account:
      type: object
      properties:
        id:
          type: string
        auth_method:
          type: string
        priority:
          type: integer
        is_healthy:
          type: boolean
        spent_this_month:
          type: number
        monthly_budget_cents:
          type: integer
        total_requests:
          type: integer
        is_available:
          type: boolean
        credential_state:
          type: string
          enum: [ok, unverified, broken, "auth_dead:invalid_token", "auth_dead:org_disabled"]
          description: Credential health from the rotator. ok = proven by a real request or probe; unverified = loaded but not yet exercised; broken = stored secret cannot be decrypted (never selectable); auth_dead:* = a real 401/403 was observed (exponential cooldown 15 min to 6 h).
        credential_detail:
          type: string
          nullable: true
          description: Operator-facing zh-TW one-liner explaining a non-ok credential_state.
        label:
          type: string
        email:
          type: string
        subscription:
          type: string
        expires_at:
          type: string
          nullable: true
        days_until_expiry:
          type: integer
          nullable: true

    MemoryEntry:
      type: object
      properties:
        id:
          type: string
        agent_id:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [episodic, semantic]
        created_at:
          type: string
          format: date-time
        relevance:
          type: number
          description: Relevance score (0.0-1.0), present in search results

    Skill:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        source:
          type: string

    CronTask:
      type: object
      properties:
        name:
          type: string
        schedule:
          type: string
        agent_id:
          type: string
        action:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_run:
          type: string
          format: date-time
          nullable: true

tags:
  - name: connection
    description: WebSocket connection and authentication
  - name: agents
    description: Agent lifecycle and management
  - name: channels
    description: Channel management (11 platforms)
  - name: accounts
    description: OAuth/API account rotation and budgets
  - name: memory
    description: Cognitive memory search and browsing
  - name: skills
    description: Skill ecosystem discovery
  - name: cron
    description: Scheduled task management
  - name: system
    description: System status, configuration, and diagnostics
  - name: license
    description: License activation and status
  - name: analytics
    description: Usage analytics and cost savings
  - name: referral
    description: Referral code system and rewards
  - name: security
    description: Audit logs, credentials, and browser approval
  - name: models
    description: Model listing (cloud + local)
  - name: logs
    description: Real-time log streaming
  - name: heartbeat
    description: Agent heartbeat scheduling
  - name: evolution
    description: Evolution engine status and skills
  - name: browser
    description: Browser automation approval (human-in-the-loop)
  - name: billing
    description: Usage and billing history
  - name: marketplace
    description: Skill marketplace
  - name: partner
    description: Partner/reseller management

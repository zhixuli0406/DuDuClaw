  # ── Models ───────────────────────────────────────────────────

  /rpc/models.list:
    post:
      tags: [models]
      summary: List available cloud and local models
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyParams"
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        provider:
                          type: string
                        type:
                          type: string
                          enum: [cloud, local]
                        source:
                          type: string
                          description: >
                            Discovery source for cloud models. `fallback` means
                            live discovery failed and this is a static list.
                          enum: [live_api, cli_probe, help_parse, pty_probe, fallback]
                        fetched_at:
                          type: string
                          description: RFC3339 timestamp of the last probe for this provider.
                  default_local:
                    type: string
                    nullable: true
                  discovered_at:
                    type: string
                    description: RFC3339 timestamp of the whole discovery run.

  /rpc/models.refresh:
    post:
      tags: [models]
      summary: Force a live re-probe of installed CLIs/APIs for their model lists
      description: >
        Re-runs the per-provider discovery chain (Anthropic /v1/models, CLI
        --help parsing, optional PTY probe), persists the cache, and returns the
        fresh list. Same response shape as models.list. Login-readable.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyParams"
      responses:
        "200":
          description: Freshly-probed model list (same shape as models.list)

  /rpc/runs.subscribe:
    post:
      tags: [runs]
      summary: Subscribe this connection to compact run.step notifications
      description: |
        An exact run_id is required; agent-wide selectors are not supported.
        At most 16 selectors per connection,
        20 subscription commands per second (one in flight), 20 steps per second.
        Every step checks current run read authority before enqueue and again
        before delivery, including task audience and history privacy;
        filtered history omits steps. Unauthorized steps never enter the queue,
        set loss state or consume delivery rate. Authorized queue or rate overflow
        sends events_lost. At most 4 authorization checks run per connection;
        candidates arriving while all checks are busy are silently discarded
        without events_lost. Refresh runs.get to reconcile; step order may vary.
        Only Claude emits live steps: channel starts at persistence, dispatch
        finished steps in a batch after run recording. Dispatch run ids are
        allocated only then, so clients generally cannot subscribe before that
        batch; use runs.get for dispatch history. Disconnect unsubscribes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [run_id]
              properties:
                run_id: {type: string, minLength: 1, maxLength: 512}
      responses:
        "200":
          description: Subscription acknowledged, or a permission/cap/rate error frame

  /rpc/runs.unsubscribe:
    post:
      tags: [runs]
      summary: Remove an exact run selector from this connection
      description: Same selector format and authorization as runs.subscribe. Idempotent.
      requestBody:
        $ref: "#/paths/~1rpc~1runs.subscribe/post/requestBody"
      responses:
        "200":
          description: Subscription removed, or an error frame

  /rpc/approvals.list:
    post:
      tags: [approvals]
      summary: Read visible approval cards with optimistic decision digests
      description: |
        Returns {approvals, count}. Same visibility as the live approval
        invalidation: current Manager (a pending password change denies).
        knowledge_add_source requires Admin or a current collection
        editor/owner. Operator-CLI kinds, workflow activation, agent file
        changes, support pilot review and board kinds require a current Admin.
        knowledge quarantine and expert-skills enable require employee Viewer.
        The workflow-activation snapshot and unbound task audience still apply.
        Cards include digest,
        null when decision material is withheld. See the Task Board feature page
        for canonical digest fields (including workflow activation pricing).
      responses:
        "200":
          description: Visible approval cards

  /rpc/approvals.get:
    post:
      tags: [approvals]
      summary: Read one approval using the same envelope and visibility as list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string, minLength: 1}
      responses:
        "200":
          description: "{approvals, count}; invisible or missing cards give an empty list"

  /rpc/approvals.decide:
    post:
      tags: [approvals]
      summary: Decide an approval, optionally checking the displayed card digest
      description: |
        expected_digest is the card's digest: lowercase SHA-256 of recursive
        sorted-key compact UTF-8 JSON with array order preserved. A mismatch
        rejects the decision and asks for a refetch; omission preserves behavior.
        The stored approval is checked again in the decision write transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, approve]
              properties:
                id: {type: string, minLength: 1}
                approve: {type: boolean}
                reason: {type: string}
                expected_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        "200":
          description: Decision result or permission/digest error frame


# DuDuClaw on NAS — Synology Container Manager「專案」與 QNAP Container
# Station「應用程式」都吃這一份 compose。詳細步驟見 README.md。
services:
  duduclaw:
    image: ghcr.io/zhixuli0406/duduclaw:latest
    container_name: duduclaw
    restart: unless-stopped
    ports:
      - "18789:18789"
    environment:
      - DUDUCLAW_BIND=0.0.0.0
      # 起步最簡路徑：填 API key（sk-ant-…）。訂閱帳號（OAuth）改照
      # README「訂閱帳號接入」一節，不用這個變數。
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # 所有狀態（設定/員工/記憶/資料庫）都在這裡——備份這個資料夾就是備份全部。
      - ./duduclaw-data:/home/duduclaw/.duduclaw
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18789/healthz"]  # /healthz 含排程器活性（停擺→503）；/health 永遠回 ok
      interval: 30s
      timeout: 5s
      retries: 3

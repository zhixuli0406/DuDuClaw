[workspace]
resolver = "2"
exclude = [
    "vendor/serenity",
    "tools/license-keygen",
    "commercial/duduclaw-license",
    # Desktop app shell (Tauri 2). Its own lockfile/target and heavy GUI deps;
    # built via `cargo tauri build` from src-tauri/, not the main workspace.
    "src-tauri",
    # 2026-09-29 (S16): duduclaw-shell / duduclaw-comp / duduclaw-native-gui
    # used to be listed here. They were always workspace-EXCLUDED detached
    # crates with their own lockfiles — the root Cargo.lock never referenced
    # them — so moving their sources to the DuDuClaw-OS repo's `crates/`
    # changed nothing in this workspace.
]
members = [
    "crates/duduclaw-core",
    "crates/duduclaw-isolation",
    "crates/duduclaw-api-worker",
    "crates/duduclaw-execution",
    "crates/duduclaw-spawnd",
    "crates/duduclaw-run",
    "crates/duduclaw-egress",
    "crates/duduclaw-parse-worker",
    "crates/duduclaw-updated",
    "crates/duduclaw-isolation-storage",
    "crates/duduclaw-mcp-boundary",
    "crates/duduclaw-migration",
    "crates/duduclaw-import",
    "crates/duduclaw-auth",
    "crates/duduclaw-gateway",
    "crates/duduclaw-security",
    "crates/duduclaw-memory",
    "crates/duduclaw-container",
    "crates/duduclaw-agent",
    "crates/duduclaw-cli",
    "crates/duduclaw-tui",
    "crates/duduclaw-dashboard",
    "crates/duduclaw-odoo",
    "crates/duduclaw-inference",
    "crates/duduclaw-desktop",
    "crates/duduclaw-identity",
    "crates/duduclaw-redaction",
    "crates/duduclaw-cli-runtime",
    "crates/duduclaw-license",
    "crates/duduclaw-fork",
    "crates/duduclaw-llm",
    "crates/duduclaw-sandbox",
    "crates/duduclaw-os",
    "crates/duduclaw-pets",
    "crates/duduclaw-relay",
    "crates/duduclaw-sysd",
    "crates/duduclaw-db",
    "crates/duduclaw-maint-tools",
    "crates/duduclaw-knowledge",
    "crates/duduclaw-onnx",
]

[workspace.package]
version = "1.81.0"
edition = "2024"
license = "Apache-2.0"
authors = ["DuDuClaw Contributors"]

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Web
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# Keep dashboard assets embedded without include-flate's vulnerable zstd stack.
# The dashboard already ships pre-minified Vite assets, so runtime behaviour is
# unchanged; the binary-size trade-off is preferable to carrying unsafe codecs.
rust-embed = "8"
mime_guess = "2"

# Terminal client (stable releases older than 14 days on 2026-10-30).
ratatui = { version = "=0.30.2", default-features = false }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows"] }
insta = { version = "=1.49.0", default-features = false }
zeroize = { version = "1", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Database
# "fallible_uint": rusqlite 0.41 moved u64/usize ToSql/FromSql behind this
# feature. Enabling it keeps 0.32 behaviour: out-of-range values error instead
# of silently converting.
rusqlite = { version = "0.41", features = ["bundled", "vtab", "fallible_uint"] }

# Docker
bollard = "0.18"

# Crypto
ring = "0.17"
base64 = "0.22"

# HTML sanitization (white-label About block) — servo ecosystem standard,
# allowlist-based; security review low. Exact patched version avoids selecting
# vulnerable 4.2.0-4.2.3 releases under a caret requirement.
ammonia = "=4.1.8"

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Streams
futures-util = "0.3"

# HTTP client (shared)
reqwest = { version = "0.12", features = ["json"] }

# mDNS / DNS-SD — LAN gateway advertising (gateway) + discovery (desktop).
# Pure Rust, no async runtime dependency, cross-platform (macOS/Linux/Windows).
mdns-sd = "0.20"

# Internal crates
duduclaw-isolation = { path = "crates/duduclaw-isolation" }
duduclaw-execution = { path = "crates/duduclaw-execution" }
duduclaw-parse-worker = { path = "crates/duduclaw-parse-worker" }
duduclaw-updated = { path = "crates/duduclaw-updated" }
duduclaw-isolation-storage = { path = "crates/duduclaw-isolation-storage" }
duduclaw-mcp-boundary = { path = "crates/duduclaw-mcp-boundary" }
duduclaw-core = { path = "crates/duduclaw-core" }
duduclaw-inference = { path = "crates/duduclaw-inference", default-features = false }
duduclaw-gateway = { path = "crates/duduclaw-gateway", default-features = false }
duduclaw-security = { path = "crates/duduclaw-security" }
duduclaw-memory = { path = "crates/duduclaw-memory" }
duduclaw-container = { path = "crates/duduclaw-container" }
duduclaw-agent = { path = "crates/duduclaw-agent" }
duduclaw-fork = { path = "crates/duduclaw-fork" }
duduclaw-dashboard = { path = "crates/duduclaw-dashboard" }
duduclaw-auth = { path = "crates/duduclaw-auth" }
duduclaw-odoo = { path = "crates/duduclaw-odoo" }
duduclaw-desktop = { path = "crates/duduclaw-desktop" }
duduclaw-identity = { path = "crates/duduclaw-identity" }
duduclaw-redaction = { path = "crates/duduclaw-redaction" }
duduclaw-cli-runtime = { path = "crates/duduclaw-cli-runtime" }
duduclaw-license = { path = "crates/duduclaw-license" }
duduclaw-llm = { path = "crates/duduclaw-llm" }
duduclaw-sandbox = { path = "crates/duduclaw-sandbox" }
duduclaw-os = { path = "crates/duduclaw-os" }
duduclaw-pets = { path = "crates/duduclaw-pets", default-features = false }
# WP-E2: gateway-side relay client integration tests spin up the real relay
# router (crates/duduclaw-relay) on an ephemeral port rather than
# re-implementing a mock — see duduclaw-gateway's [dev-dependencies].
duduclaw-relay = { path = "crates/duduclaw-relay" }
duduclaw-sysd = { path = "crates/duduclaw-sysd" }
duduclaw-db = { path = "crates/duduclaw-db" }
duduclaw-knowledge = { path = "crates/duduclaw-knowledge" }
duduclaw-onnx = { path = "crates/duduclaw-onnx", default-features = false }

# Published CE binaries and desktop gateway sidecars share this profile.
# Keep panic messages and source locations; only symbol tables are removed.
# Windows release jobs override this to "none" to preserve separate PDBs.
# Size/build-time trade-off (RM-100 smaller update package, RM-163 shorter build;
# owner decision 2026-11-09). Measured on a 32-vCPU Linux builder (16 jobs) with
# the full dashboard: ~160 MB binary (must stay < 200 MB for updaters <= v1.79.2),
# release build ~353 s vs ~1186 s with codegen-units = 1; the memory test suite
# runs ~2-4% slower. Commit fc0b652f7 introduced codegen-units = 1.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 16
opt-level = "s"

# Debug builds only. The workflow MCP path
# hashes the whole running CLI binary (~336 MB in a debug build) with SHA-256
# on every workflow tool call to detect environment drift. Unoptimized `sha2`
# takes 13-19 s per hash, which made every debug workflow call (and every
# timing-bounded stdio test) slow. Optimizing just this crate brings one hash
# to under a second; the hash input, algorithm and every check are unchanged.
[profile.dev.package.sha2]
opt-level = 3

# Keep Songbird's Serenity bridge while moving its TLS transport onto the
# workspace's maintained rustls 0.23 stack. The vendored SDK retains its version.
[patch.crates-io]
serenity = { path = "vendor/serenity" }
# CVE-2026-119375 / RUSTSEC-2026-0459: rusqlite 0.41 (libsqlite3-sys 0.39) serves
# SQLite; sqlx's SQLite driver is unused and its libsqlite3-sys ^0.30 would
# conflict on `links = "sqlite3"`. Replace it with a dependency-free stub.
sqlx-sqlite = { path = "third_party/sqlx-sqlite-stub" }

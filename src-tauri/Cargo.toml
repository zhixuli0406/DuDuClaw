[package]
name = "duduclaw-desktop-app"
version = "1.33.0"
description = "DuDuClaw desktop shell (Tauri 2) — wraps the gateway + dashboard in a native window"
edition = "2021"
license = "Apache-2.0"
authors = ["DuDuClaw Contributors"]

# Detached from the Rust workspace on purpose (see root Cargo.toml `exclude`):
# the desktop shell carries heavy GUI deps and its own lockfile.
[workspace]

# Desktop-only: a plain binary crate (src/main.rs). No `[lib]` — the mobile-ready
# staticlib/cdylib template needs a src/lib.rs we don't ship (iOS/Android are out
# of scope; their generated icons are pruned too).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for the transparent desktop-pet window
# (§7.4). It pairs with `"macOSPrivateApi": true` in tauri.conf.json. Note:
# apps using the private API cannot ship on the Mac App Store — DuDuClaw is
# distributed as a signed DMG (Developer ID), so this is fine.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Gateway picker (WP-GW): mDNS LAN discovery + /healthz probing + URL scheme
# validation. rustls-tls keeps HTTPS gateway probing off system OpenSSL.
mdns-sd = "0.20"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Photo → desktop-pet pack format + local background removal (WP-P2/P3). The
# `onnx` pulls the ort/onnxruntime path (BiRefNet/silueta local background
# removal). ort-sys 2.0.0-rc.12 ships prebuilt onnxruntime ONLY for
# aarch64-macos and windows — the v1.46.0 desktop CI failed on
# x86_64-apple-darwin and x86_64-linux with "ort does not provide prebuilt
# binaries for the target". Target-gate the feature: those platforms build
# without `onnx` and pet generation degrades to the passthrough remover
# (photo kept as-is), everything else identical.
duduclaw-pets = { path = "../crates/duduclaw-pets" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Background update watcher timers (tauri's async runtime is tokio already;
# this only adds the `time` feature surface).
tokio = { version = "1", features = ["time"] }
# Transitive pin (not used directly): time 0.3.52 changed the public
# `Parsable::parse` signature (a breaking change within 0.3.x), which fails to
# compile against cookie 0.18.1 pulled in by tauri/wry. Hold time at 0.3.51 until
# tauri ships a cookie that targets the new API. Remove once that lands.
time = "=0.3.51"

# ONNX-backed background removal only where ort-sys has prebuilt onnxruntime
# (see the duduclaw-pets comment above). Same path + extra feature is a legal
# Cargo pattern: features unify on matching targets.
[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), target_os = "windows"))'.dependencies]
duduclaw-pets = { path = "../crates/duduclaw-pets", features = ["onnx"] }

[features]
# Bundle artifacts use this; keep parity with Tauri's default template.
custom-protocol = ["tauri/custom-protocol"]
